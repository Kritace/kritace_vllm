 -66)"><rect/><foreignObject width="431.78125" height="132"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel "><div style="display: flex; align-items: center; justify-content: center; white-space: nowrap;"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mtable rowspacing="0.25em" columnalign="center" columnspacing="0em"><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mtext mathvariant="bold">这些情况不要开</mtext></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mtext>PP=2 同时叠图与编译：实测直接崩，只做规避未挖根因</mtext></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mtext>EP 加图是负交互：图下从 201.04 掉到 161.33，降 19.8</mtext></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mtext>形状每步都变、张量极小、显存贴顶、需要断点</mtext></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mtext>PP=2+cg+compile</mtext><mo>⇒</mo><mtext>启动即崩</mtext></mrow></mstyle></mtd></mtr></mtable></math></span></div></span></div></foreignObject></g></g><g class="node default  " id="mmd_render_0-flowchart-C5-39" data-look="classic" transform="translate(510.1484375, 5853.59375)"><rect class="basic label-container" style="" x="-216.390625" y="-82.03125" width="432.78125" height="164.0625"/><g class="label" style="" transform="translate(-186.390625, -67.03125)"><rect/><foreignObject width="372.78125" height="134.0625"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel "><div style="display: flex; align-items: center; justify-content: center; white-space: nowrap;"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mtable rowspacing="0.25em" columnalign="center" columnspacing="0em"><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mtext mathvariant="bold">成本也要减掉，别只算收益</mtext></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mtext>收益随调用次数线性涨，启动成本只付有限次</mtext></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mtext>图要按档位各录一次，编译有冷热缓存之差</mtext></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mtext>离线小批量、形状多变时，成本会把收益吃回去</mtext></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mtext>净收益</mtext><mo>=</mo><mi>N</mi><mi mathvariant="normal">Δ</mi><mi>T</mi><mo>−</mo><msub><mi>T</mi><mtext>启动</mtext></msub><msub><mi>N</mi><mtext>重录</mtext></msub></mrow></mstyle></mtd></mtr></mtable></math></span></div></span></div></foreignObject></g></g><g class="node default io " id="mmd_render_0-flowchart-C6-40" data-look="classic" transform="translate(510.1484375, 6084.2578125)"><rect class="basic label-container" style="fill:#fff4e6 !important;stroke:#c07a2b !important;stroke-width:1.5px !important" x="-208.390625" y="-82.6328125" width="416.78125" height="165.265625"/><g class="label" style="" transform="translate(-178.390625, -67.6328125)"><rect/><foreignObject width="356.78125" height="135.265625"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel "><div style="display: flex; align-items: center; justify-content: center; white-space: nowrap;"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mtable rowspacing="0.25em" columnalign="center" columnspacing="0em"><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mtext mathvariant="bold">收束：两个杠杆各压一层，先算比值再验证</mtext></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mtext>图管调度层，编译管计算层，覆盖阶段也不同</mtext></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mtext>能叠加的判据是两项都还占显著比例</mtext></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mtext>开了之后要用三层工具确认它真的发生了</mtext></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><msub><mi>S</mi><mtext>both</mtext></msub><mo>≈</mo><msub><mi>S</mi><mtext>cg</mtext></msub><mo>×</mo><msub><mi>S</mi><mtext>compile</mtext></msub><mtext> （仅当两项无重叠）</mtext></mrow></mstyle></mtd></mtr></mtable></math></span></div></span></div></foreignObject></g></g></g></g></g><defs><filter id="mmd_render_0-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="mmd_render_0-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg></div></div>

<script>
const stage = document.getElementById('stage');
const wrap  = document.getElementById('wrap');
const pctEl = document.getElementById('pct');
const svg   = wrap.querySelector('svg');
let scale = 1, tx = 0, ty = 0;
const W = svg ? (+svg.getAttribute('width')  || svg.viewBox.baseVal.width  || 1000) : 1000;
const H = svg ? (+svg.getAttribute('height') || svg.viewBox.baseVal.height || 1000) : 1000;
function apply() {
  wrap.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  pctEl.textContent = Math.round(scale * 100) + '%';
}
function fit(mode) {
  const r = stage.getBoundingClientRect();
  const k = mode === 'w' ? (r.width - 24) / W : (r.height - 24) / H;
  scale = Math.max(0.01, k);
  tx = (r.width  - W * scale) / 2;
  ty = (r.height - H * scale) / 2;
  apply();
}
function zoomAt(cx, cy, factor) {
  const ns = Math.min(20, Math.max(0.02, scale * factor));
  tx = cx - (cx - tx) * (ns / scale);
  ty = cy - (cy - ty) * (ns / scale);
  scale = ns; apply();
}
document.getElementById('fitw').onclick = () => fit('w');
document.getElementById('fith').onclick = () => fit('h');
document.getElementById('one').onclick  = () => { scale = 1; tx = 12; ty = 12; apply(); };
document.getElementById('zi').onclick   = () => { const r = stage.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, 1.25); };
document.getElementById('zo').onclick   = () => { const r = stage.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, 0.8); };
stage.addEventListener('wheel', (e) => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.12 : 0.89);
}, { passive: false });
let drag = null;
stage.addEventListener('mousedown', (e) => { drag = { x: e.clientX - tx, y: e.clientY - ty }; stage.classList.add('dragging'); });
window.addEventListener('mousemove', (e) => { if (!drag) return; tx = e.clientX - drag.x; ty = e.clientY - drag.y; apply(); });
window.addEventListener('mouseup', () => { drag = null; stage.classList.remove('dragging'); });
stage.addEventListener('dblclick', () => fit('w'));
window.addEventListener('keydown', (e) => {
  if (e.key === '+' || e.key === '=') document.getElementById('zi').click();
  else if (e.key === '-') document.getElementById('zo').click();
  else if (e.key === '0') fit('w');
});
window.addEventListener('resize', () => fit('w'));
fit('w');
</script>
