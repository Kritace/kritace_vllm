<script>
const stage = document.getElementById('stage');
const wrap  = document.getElementById('wrap');
const pctEl = document.getElementById('pct');
const svg   = wrap.querySelector('svg');
let scale = 1, tx = 0, ty = 0;
const W = svg ? (+svg.getAttribute('width')  || svg.viewBox.baseVal.width  || 1000) : 1000;
const H = svg ? (+svg.getAttribute('height') || svg.viewBox.baseVal.height || 1000) : 1000;
function apply() {
  wrap.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  pctEl.textContent = Math.round(scale * 100) + '%';
}
function fit(mode) {
  const r = stage.getBoundingClientRect();
  const k = mode === 'w' ? (r.width - 24) / W : (r.height - 24) / H;
  scale = Math.max(0.01, k);
  tx = (r.width  - W * scale) / 2;
  ty = (r.height - H * scale) / 2;
  apply();
}
function zoomAt(cx, cy, factor) {
  const ns = Math.min(20, Math.max(0.02, scale * factor));
  tx = cx - (cx - tx) * (ns / scale);
  ty = cy - (cy - ty) * (ns / scale);
  scale = ns; apply();
}
document.getElementById('fitw').onclick = () => fit('w');
document.getElementById('fith').onclick = () => fit('h');
document.getElementById('one').onclick  = () => { scale = 1; tx = 12; ty = 12; apply(); };
document.getElementById('zi').onclick   = () => { const r = stage.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, 1.25); };
document.getElementById('zo').onclick   = () => { const r = stage.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, 0.8); };
stage.addEventListener('wheel', (e) => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.12 : 0.89);
}, { passive: false });
let drag = null;
stage.addEventListener('mousedown', (e) => { drag = { x: e.clientX - tx, y: e.clientY - ty }; stage.classList.add('dragging'); });
window.addEventListener('mousemove', (e) => { if (!drag) return; tx = e.clientX - drag.x; ty = e.clientY - drag.y; apply(); });
window.addEventListener('mouseup', () => { drag = null; stage.classList.remove('dragging'); });
stage.addEventListener('dblclick', () => fit('w'));
window.addEventListener('keydown', (e) => {
  if (e.key === '+' || e.key === '=') document.getElementById('zi').click();
  else if (e.key === '-') document.getElementById('zo').click();
  else if (e.key === '0') fit('w');
});
window.addEventListener('resize', () => fit('w'));
fit('w');
</script>

y；decode 通道的 flash_attn_with_kvcache 每序列只收 1 个。\n        spec = [s for s in d if s.spec_draft_ids]\n        if spec:\n            d = [s for s in d if not s.spec_draft_ids]\n            p = [*p, *spec]\n        return ScheduledBatch(prefills=p, decodes=d)","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/control/scheduler.py:97"],["src/config.py",45,"EngineConfig","mix_prefill_decode / max_num_batched_tokens / max_num_seqs 都定义在这","class EngineConfig:\n    \"\"\"引擎配置：调度 / 内存 / 算子 / 并行。\n\n    并行语义（三者正交，分叉点不同）::\n\n        dp_size  → 独立 Engine 副本数（``MPClient`` / ZMQ）；不进入 NCCL world\n        tp_size  → 同 Engine 内张量并行度（NCCL all-reduce / gather）\n        pp_size  → 同 Engine 内流水线 stage 数（NCCL P2P hidden+residual）\n\n    ``enable_ep`` 不增加 world：Attention 仍走 TP，MoE 在同一批 TP rank 上按 expert 切分。\n    单 Engine 的 NCCL ``world_size = tp_size * pp_size``。\n    \"\"\"\n\n    model: str\n\n    #  调度器\n    context_len: int = 4096\n    # 单条请求的最大长度（prompt + 生成）。它直接决定 KV 池要开多大。\n    max_num_seqs: int = 256\n    # 单步最多几条序列并发。\n    max_num_batched_tokens: int = 8192\n    mix_prefill_decode: bool = True\n\n    kvcache_block_size: int = 256\n    # 必须是 256 的倍数 —— 这是 FlashAttention-2 paged 的实现约束，\n    # 不满足时中间会有 assert 报错。所以 __post_init__ 里提前拦一道。\n    gpu_memory_utilization: float = 0.9\n    num_kvcache_blocks: int = 0\n    prefix_backend: str = \"hash\"\n\n    enforce_eager: bool = True\n    torch_compile: bool = False\n    compile_mode: str = \"reduce-overhead\"\n    compile_dynamic: bool = True\n    # True = 符号形状：一次编译覆盖任意长度，代价是数值上略有保守。\n    # False = 固定形状：每次遇到新长度都要重编译（~2-12 秒），只适合离线固定长度。\n    dtype: str = \"auto\"\n\n    tp_size: int = 1\n    pp_size: int = 1\n    # … 其余略；点「在 VS Code 打开」看全文","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/config.py:45"]],"vllm":[["vllm/v1/core/sched/scheduler.py",501,"Scheduler.schedule","统一调度入口：没有 prefill/decode 阶段之分，按 num_computed_tokens 追平","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp ills, decodes, 0)\n        # 有 decode 跑成了 → 把剩下的 token 预算花在 prefill 上，不浪费这一轮。\n        if decodes:\n            # 投机验证的 batch 布局是**定宽** [bs, K+1]（见 model_runner._spec_verify），\n            # 混入普通 prefill 会让定宽切片错位。所以有草稿的这一步不再拉新请求，\n            # 等验证结束、草稿被消费后，下一步再正常拉取。\n            if not any(s.spec_draft_ids for s in decodes):\n                self._pull_prefill_chunk(prefills, decodes, used)\n            return prefills, decodes\n        # 一条 decode 都没跑成（比如刚启动、或者 running 空了）→ 退化成 prefill 优先。\n        return self._schedule_prefill_first()","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/control/scheduler.py:284"]],"vllm":[["vllm/v1/core/sched/scheduler.py",501,"Scheduler.schedule","统一调度入口：没有 prefill/decode 阶段之分，按 num_computed_tokens 追平","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/core/sched/scheduler.py:501"],["vllm/v1/core/sched/scheduler.py",550,"Scheduler.schedule","“First, schedule the RUNNING requests”：先给 running 列表分 token 预算","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/core/sched/scheduler.py:550"],["vllm/v1/core/sched/scheduler.py",670,"Scheduler.schedule","PRIORITY 策略下抢占 (priority, arrival_time) 最差者；FCFS 则 pop 队尾","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/core/sched/scheduler.py:670"],["vllm/v1/core/sched/request_queue.py",13,"SchedulingPolicy","策略枚举 FCFS/PRIORITY，决定 waiting 队列用哪种实现","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/core/sched/request_queue.py:13"]],"vcmp":["默认 FCFS 下都先跑已在跑的解码请求，再用剩下的 token 预算从 waiting 拉 prefill。","我们用一个布尔开关 mix_prefill_decode 二选一：_schedule_mixed 或 _schedule_prefill_first（后者只要拉到 prefill 就 return，decode 会被饿死）。vLLM 没有这个开关，永远只有一个 schedule()，先 running 后 waiting，running 是 list 而不是队列，另外可以用 policy 换成 PRIORITY 堆，还有 skipped_waiting 队列和 async_scheduling。"],"doc":{"a":"flowdoc-M1","sec":"ch-c4-h3-4","sect":"4.2.2 混合策略：先做 decode，再用剩余预算喂 prefill","cid":"C4","text":"在干什么：_schedule_mixed 先以 0 预算调用 _schedule_decode（语义是\"先做、不设上限\"），若本步确实排上了 decode，就把剩余 token 预算交给 _pull_prefill_chunk；","hl":["_schedule_mixed"],"k":13}},"M2":{"t":"prefill 优先模式：先拉 prefill（allow_trailing_p","c":"C4","n":"调度器","lab":["prefill 优先模式：先拉 prefill（allow_trailing_partial = False）","有 prefill 就【一个 decode 都不跑】 ⇒ TTFT 好、ITL 差"],"cite":[["src/control/scheduler.py",266,"Scheduler._schedule_prefill_first","prefill 优先：有 prefill 就一个 decode 都不跑","    def _schedule_prefill_first(self) -> tuple[list[Sequence], list[Sequence]]:\n        prefills: list[Sequence] = []\n        decodes: list[Sequence] = []\n        # allow_trailing_partial=False 是这个模式的灵魂：\n        #   一旦本轮已经有 prefill 了，就绝不再塞\"会被切开\"的序列。\n        #    保证一轮里的 prefill 都是完整的，行为可预测、延迟好估算。\n        # prefill 优先模式下，不允许在已有 prefill 后追加部分 chunk。\n        self._pull_prefill_chunk(prefills, decodes, 0, allow_trailing_partial=False)\n        # 有 prefill 可做 → 本轮**只**做 prefill，decode 一个都不跑（注意返回的是空 decodes）。\n        if prefills:\n            return prefills, []\n        self._schedule_decode(prefills, decodes, 0)\n        return [], decodes","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/control/scheduler.py:266"]],"vllm":[["vllm/v1/core/sched/scheduler.py",501,"Scheduler.schedule","统一调度入口：没有 prefill/decode 阶段之分，按 num_computed_tokens 追平","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/core/sched/scheduler.py:501"],["vllm/v1/core/sched/scheduler.py",550,"Scheduler.schedule","“First, schedule the RUNNING requests”：先给 running 列表分 token 预算","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/core/sched/scheduler.py:550"],["vllm/v1/core/sched/scheduler.py",670,"Scheduler.schedule","PRIORITY 策略下抢占 (priority, arrival_time) 最差者；FCFS 则 pop 队尾","vscode://vsc ct":"4.2.3 decode 循环：先出草稿、再按 K+1 预留 KV、预算不够就退回","cid":"C4","text":"在干什么：从 running 队头逐条取序列，先调 drafter 出草稿（若有），把 n_new = len(draft) + 1 当作本步要占的 token/KV 数；","hl":["队头"],"k":17}},"D2":{"t":"出草稿（投机）：NgramDrafter.propose(token_ids","c":"C4","n":"调度器","lab":["出草稿（投机）：NgramDrafter.propose(token_ids,","K) —— 纯 CPU 查表 n_new =","len(draft) + 1：按 K+1 个位置预留 KV，不是 K","n_{\\mathrm{new}}=K+1"],"cite":[["src/spec/ngram.py",49,"NgramDrafter.propose","n-gram 查表出草稿：纯 CPU，不碰显存","    def propose(self, token_ids: list[int], k: int) -> list[int]:\n        \"\"\"返回最多 ``k`` 个候选 token；找不到任何匹配时返回空列表。\n\n        生成方式是\"匹配一个 → 接上 → 再匹配一个\"，因此草稿自身也参与匹配，\n        可以在重复片段里连续延长。\n        \"\"\"\n        # 两个前置条件：k>0（否则不必生成），以及历史长度至少 min_n+1\n        # （要匹配 n 个历史 token 并取出它的后继，至少得有 n+1 个 token）。\n        if k <= 0 or len(token_ids) < self.min_n + 1:\n            return []\n\n        # 返回给上层的草稿（最多 k 个；匹配不上就提前结束，长度可以不足 k）。\n        out: list[int] = []\n        # 复制一份 history 用于**追加**匹配到的草稿 token。\n        # 不能直接改调用方传进来的 list（调用方的序列状态不能被草稿影响）。\n        history = list(token_ids)\n        # 每轮尝试「匹配一个 token → 接上 → 再匹配下一个」。\n        for _ in range(k):\n            # 取不到后继（历史里没有这个后缀）就停：宁可少给草稿，也不要瞎猜一个。\n            nxt = self._match_once(history)\n            if nxt is None:\n                break\n            # 一个个累积成草稿列表。\n            out.append(nxt)\n            # ★ 关键一步：把草稿接进 history，让下一轮匹配能利用它。\n            # 没有这一行，多 token 草稿就会退化成\"同一个后继重复 K 次\"。\n            history.append(nxt)\n        return out","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/spec/ngram.py:49"]],"vllm":[],"vcmp":[],"doc":{"a":"flowdoc-D2","sec":"ch-c4-h3-5","sect":"4.2.3 decode 循环：先出草稿、再按 K+1 预留 KV、预算不够就退回","cid":"C4","text":"在干什么：从 running 队头逐条取序列，先调 drafter 出草稿（若有），把 n_new = len(draft) + 1 当作本步要占的 token/KV 数；","hl":["出草稿"],"k":17}},"D3":{"t":"token 预算够不够：本步已用 + 这条要的 超过上限吗？","c":"C4","n":"调度器","lab":["token 预算够不够：本步已用 + 这条要的 超过上限吗？","tokens_used + n_new >","max_num_batched_tokens ？","t_{\\mathrm{used}}+n_{\\ma uence, num_new_tokens: int) -> bool:\n        \"\"\"投机解码：一次追加 num_new_tokens 个 token 的预检。\n\n        ⚠️ 投机路径下有两个不同的量，别弄混：\n          - **写入 KV 的位置数** = K+1（验证阶段把草稿全写进去）\n          - **最终有效的 token 数** = j+1（j 为被接受的草稿数）\n        因此调用方必须按 K+1 预留，再在验证结束后把 num_cached_tokens\n        推进到 j+1 —— 多余的 K-j 个 slot 留在同一页里，下步覆盖写即可。\n        \"\"\"\n        return self.blocks.can_append_n(seq, num_new_tokens)","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/data/kv.py:163"],["src/data/block_manager.py",238,"BlockManager.can_append_n","块级判断：free + cached 够不够","    def can_append_n(self, seq, num_new_tokens: int) -> bool:\n        \"\"\"预检：在 seq 之上再追加 num_new_tokens 个 token，页够不够。\n\n        ⚠️ 与 can_append 不同，本方法在**追加之前**调用，\n        `num_new_tokens` 表示\"将要追加的数量\"。\n        \"\"\"\n        need = self.blocks_for(len(seq) + num_new_tokens)\n        return self.available_slots >= need - len(seq.block_table)","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/data/block_manager.py:238"]],"vllm":[["vllm/v1/core/kv_cache_manager.py",118,"KVCacheManager","request 级 KV 门面：持有 coordinator，暴露 allocate / get_computed / cache / free","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/core/kv_cache_manager.py:118"],["vllm/v1/core/kv_cache_manager.py",343,"KVCacheManager.allocate_slots","一次完成水位检查 + 前缀命中块复用 + 新块分配，失败返回 None","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/core/kv_cache_manager.py:343"],["vllm/v1/core/kv_cache_manager.py",228,"KVCacheManager.get_computed_blocks","查前缀缓存命中的块 → (块, num_new_computed_tokens, num_external)","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/core/kv_cache_manager.py:228"],["vllm/v1/core/kv_cache_manager.py",566,"KVCacheManager.free","请求结束/被抢占时释放它的块（满块可能留作缓存）","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/ thrm{fresh}"],"cite":[["src/data/kv.py",118,"KVManager.allocate","先查前缀能复用就复用，剩下的新分配","    def allocate(self, seq: Sequence) -> None:\n        # 每次分配都从干净状态开始：块表清空、缓存计数归零。\n        seq.block_table.clear()\n        seq.num_cached_tokens = 0\n        # 这条序列现在需要多少块。\n        need = seq.num_blocks\n        # 不需要块时也要刷新统计值，避免上层读到上一轮的残留。\n        if need == 0:\n            self.last_num_cached_tokens = 0\n            return\n\n        # 再算一次复用上限。\n        max_cached = self._fit_prefix(seq)\n        # 到这里还是 -1，说明调用方跳过了准入检查，直接报错比默默算错好。\n        if max_cached < 0:\n            raise RuntimeError(\"not enough KV blocks for sequence\")\n        # 再取一次命中列表：这次要真正用它来登记块。\n        hit = self.index.match(seq, self.blocks)\n\n        # 命中的块：引用计数 +1（从 cached 变 used），并写进本序列的块表。\n        for bid in hit[:max_cached]:\n            self.blocks.acquire_hit(bid)\n            seq.block_table.append(bid)\n\n        # 剩下的块新分配。\n        for _ in range(max_cached, need):\n            seq.block_table.append(self.blocks.allocate_fresh())\n\n        # 缓存长度 = 复用的块数 × 页大小。这就是 prefill 起始 position 的来源。\n        seq.num_cached_tokens = max_cached * self.block_size\n        # 记给上层做命中统计。\n        self.last_num_cached_tokens = seq.num_cached_tokens\n\n        # radix 后端还要把命中的路径「钉住」，防止它在后续步骤里被回收。\n        if isinstance(self.index, RadixPrefixIndex) and max_cached > 0:\n            self.index.pin_match(seq, max_cached)","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/data/kv.py:118"],["src/data/kv.py",88,"KVManager._fit_prefix","前缀命中 + 可回收 cached 一起算空间","    def _fit_prefix(self, seq: Sequence) -> int:\n        \"\"\"前缀复用预检查：计算当前序列最多可复用多少连续前缀 KV 块。\"\"\"\n        # 这条序列总共需要多少块。\n        need = seq.num_blocks\n        # 一条空序列不需要任何块。\n        if need == 0:\n            return 0\n        # 问索引：能命中哪几块（返回顺序就是前缀顺序）。\n        hit = self.index.match(seq, self.blocks)\n        # 命中数不能超过总需求 —— 序列可能比缓存短。\n        max_cached = min(len(hit), need)\n        # 命中的块里有多少处于 cached 状态（可被挤掉来腾空间）。\n        reclaimable = sum(\n            1 for b in hit[:max_cached] if b in self.blocks.cached_ids\n        )\n        # 池子里**其它** cached 块的数量：它们同样是可回收的候选。\n        other_cached = len(self.blocks.cached_ids) - reclaimable\n        # 复用之外，还需要新分配多少块。\n        new_needed = need - max_cached\n        # 关键判断：**自由块 + 可回收的其它缓存块** ≥ 新需求，就能允许复用。\n        if self.blocks.num_free + other_cached >= new_needed:\n            return max_cached\n        # 放不下时返回 -1 作为信号，由调用方决定是拒绝还是抢占。\n        return -1","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/data/kv.py:88"]],"vllm":[["vllm/v1/core/kv_cache_manager.py",118,"KVCacheManager","request 级 KV 门面：持有 coordinator，暴露 allocate / get_computed / cache / free","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/core/kv_cache_manager.py:118"],["vllm/v1/core/kv_cache_manager.py",343,"KVCacheManager.allocate_slots","一次完成水位检查 + 前缀命中块复用 + 新块分配，失败返回 None","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/core/kv_cache_manager.py:343"],["vllm/v1/core/kv_cache_manager.py",228,"KVCacheManager.get_computed_blocks","查前缀缓存命中的块 → (块, num_new_computed_tokens, num_external)","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/core/kv_cache_manager.py:228"],["vllm/v1/core/kv_cache_manager.py",566,"KVCacheManager.free","请求结束/被抢占时释放它的块（满块可能留作缓存）","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/core/kv_cache_manager.py:566"],["vllm/v1/core/kv_cache_coordinator.py",65,"KVCacheCoordinator","跨 KV cache 组（混合/滑动窗/Mamba）协调分配与命中的抽象层","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/core/kv_cache_coordinator.py:65"],["vllm/v1/core/kv_cache_coordinator.py",271,"KVCacheCoordinator.allocate_new_blocks","按组向块池申请新块","vscode://vscode-remote ","n":"调度器","lab":["本步拉不到 prefill（waiting 空或序列数满）⇒ 混合模式退化成纯 decode"],"cite":[["src/control/scheduler.py",284,"Scheduler._schedule_mixed","拉不到 prefill ⇒ 退化成纯 decode","    def _schedule_mixed(self) -> tuple[list[Sequence], list[Sequence]]:\n        prefills: list[Sequence] = []\n        decodes: list[Sequence] = []\n        # 这里给 decode 传的预算是 0，不是\"没用预算\"的意思 ——\n        # decode 是\"先做、不设上限\"的，真正的账由下面把 used 交给 prefill 去算。\n        used = self._schedule_decode(prefills, decodes, 0)\n        # 有 decode 跑成了 → 把剩下的 token 预算花在 prefill 上，不浪费这一轮。\n        if decodes:\n            # 投机验证的 batch 布局是**定宽** [bs, K+1]（见 model_runner._spec_verify），\n            # 混入普通 prefill 会让定宽切片错位。所以有草稿的这一步不再拉新请求，\n            # 等验证结束、草稿被消费后，下一步再正常拉取。\n            if not any(s.spec_draft_ids for s in decodes):\n                self._pull_prefill_chunk(prefills, decodes, used)\n            return prefills, decodes\n        # 一条 decode 都没跑成（比如刚启动、或者 running 空了）→ 退化成 prefill 优先。\n        return self._schedule_prefill_first()","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/control/scheduler.py:284"]],"vllm":[],"vcmp":[],"doc":{"a":"flowdoc-P15","sec":"ch-c4-h3-6","sect":"4.2.4 prefill 循环：按 token 预算切 chunk，不采样就不判完成","cid":"C4","text":"为什么这么写 / 替代方案 / 代价：长 prompt 的 prefill 会独占一步很久，期间所有 decode 都卡住（src/control/scheduler.py:13-15），所以按 token 预算切块，切在哪完全由预算决定——这就是 chunked prefill 名字的来源（src…","hl":["scheduler"],"k":23}},"P16":{"t":"回到 waiting 下一条，直到：waiting 空 / token 预算用完","c":"C4","n":"调度器","lab":["回到 waiting 下一条，直到：waiting 空 / token 预算用完 / 序列数满 / 页池不够"],"cite":[["src/control/scheduler.py",181,"Scheduler._pull_prefill_chunk","循环退出条件：waiting 空 / 预算用尽 / 序列数满 / 页池不够","    def _pull_prefill_chunk(\n        self,\n        prefills: list[Sequence],\n        decodes: list[Sequence],\n        tokens_used: int,\n        *,\n        allow_trailing_partial: bool = True,","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/control/scheduler.py:181"]],"vllm":[["vllm/config/sched ed。vLLM 用两个独立预算 token_budget 与 input_budget（后者要扣掉草稿槽）、没有 n_partial 计数，chunked prefill 可以整个关掉（关掉时直接 break 而不是截断），另外还有 long_prefill_token_threshold、mamba 对齐、编码器输入等二次切分。"],"doc":{"a":"flowdoc-P16","sec":"ch-c4-h3-6","sect":"4.2.4 prefill 循环：按 token 预算切 chunk，不采样就不判完成","cid":"C4","text":"为什么这么写 / 替代方案 / 代价：长 prompt 的 prefill 会独占一步很久，期间所有 decode 都卡住（src/control/scheduler.py:13-15），所以按 token 预算切块，切在哪完全由预算决定——这就是 chunked prefill 名字的来源（src…","hl":["scheduler"],"k":23}},"N1":{"t":"归一：有草稿的序列必须从 decodes 移到 prefills","c":"C4","n":"调度器","lab":["归一：有草稿的序列必须从 decodes 移到 prefills","只有 varlen attention 能一次算 K+1 个query；","decode 通道每序列只收 1 个","W=\\max_{s}K_{s}+1"],"cite":[["src/control/scheduler.py",331,"Scheduler._spec_width","定宽：width = max(K)+1，有草稿的序列从 decodes 移到 prefills","    def _spec_width(seqs: list[Sequence]) -> int:\n        \"\"\"投机验证的定宽：每条序列在扁平数组里占多少个元素。\n\n        取 ``max(len(草稿)) + 1`` 而不是各序列自己的长度 —— 不同序列的\n        n-gram 命中情况不同，草稿长度会不一样，必须 pad 到同一个宽度，\n        才能让 ``i*width : (i+1)*width`` 这种切片对齐（短的那条后面是 pad -1）。\n        \"\"\"\n        return max(len(s.spec_draft_ids) for s in seqs) + 1","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/control/scheduler.py:331"]],"vllm":[],"vcmp":[],"doc":{"a":"flowdoc-N1","sec":"ch-c4-h3-3","sect":"4.2.1 入口：选策略，并把带草稿的序列挪进 prefill 通道","cid":"C4","text":"p, d = self._schedule_prefill_first() # 有草稿的序列必须走 prefill 通道：只有 varlen attention 能一次","hl":["只有"],"k":10}},"N2":{"t":"产出 ScheduledBatch(prefills, decodes) 交给 ","c":"C4","n":"调度器","lab":["产出 ScheduledBatch(prefills, decodes) 交给 Executor","顺序契约：decode 的 id 在前、prefill 的在后（回写时 zip 依赖这个顺序）"],"cite":[["src/data/batch.py",55,"ScheduledBatch","交给执行器的批结构：prefills / decodes 的顺序契约","class ScheduledBatch:\n    \"\"\"本步要跑的 prefill / decode 序列。Scheduler 与 EngineCore 使用；Worker 只吃 to_wire()。\"\"\"\n\n    # 本步要跑的两类序列：prefill（含 chunked）与 decode。\n    prefills: list[Sequence] = field(default_factory=list)\n    decodes: list[Sequence] = field(default_factory=list)\n\n    # 引擎用它判断\"这步是不是白跑了\"（是就要累计空转次数，见 Engine._MAX_IDLE_STEPS）。\n    def is_empty(self) -> bool:\n        return not self.prefills and not self.decodes\n\n    def to_wire(self) -> \"SchedulerOutput\":\n        \"\"\"抽出本步前向需要的字段，不把整条 token 历史发给 Worker。\"\"\"\n        return SchedulerOutput(\n            prefills=[_prefill_schedule(s) for s in self.prefills],\n            decodes=[_decode_schedule(s) for s in self.decodes],\n        )","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/data/batch.py:55"]],"vllm":[],"vcmp":[],"doc":{"a":"flowdoc-N2","sec":"ch-c4-h3-3","sect":"4.2.1 入口：选策略，并把带草稿的序列挪进 prefill 通道","cid":"C4","text":"在干什么：schedule() 按 mix_prefill_decode 二选一调用策略函数，拿到 (prefills, decodes) 两个列表后，把 decode 列表里带有 spec_draft_ids 的序列搬到 prefills 列表，再包成 ScheduledBatch 返回。","hl":["scheduledbatch"],"k":9}},"S1":{"t":"① n-gram 查表出草稿 [t₁ … t_K]（纯 CPU、不占显存）","c":"C11","n":"投机解码","lab":["① n-gram 查表出草稿 [t₁ … t_K]（纯 CPU、不占显存）","不跑模型 ⇒ 【没有草稿 KV、也没有概率 q】 ⇒ 只能做贪心判定"],"cite":[["src/spec/ngram.py",49,"NgramDrafter.propose","① 出草稿：不跑模型 ⇒ 没有草稿 KV、也没有概率 q","    def propose(self, token_ids: list[int], k: int) -> list[int]:\n        \"\"\"返回最多 ``k`` 个候选 token；找不到任何匹配时返回空列表。\n\n        生成方式是\"匹配一个 → 接上 → 再匹配一个\"，因此草稿自身也参与匹配，\n        可以在重复片段里连续延长。\n        \"\"\"\n        # 两个前置条件：k>0（否则不必生成），以及历史长度至少 min_n+1\n        # （要匹配 n 个历史 token 并取出它的后继，至少得有 n+1 个 token）。\n        if k <= 0 or len(token_ids) < self.min_n + 1:\n            return []\n\n        # 返回给上层的草稿（最多 k 个；匹配不上就提前结束，长度可以不足 k）。\n        out: list[int] = []\n        # 复制一份 history 用于**追加**匹配到的草稿 token。\n        # 不能直接改调用方传进来的 list（调用方的序列状态不能被草稿影响）。\n        history = list(token_ids)\n        # 每轮尝试「匹配一个 token → 接上 → 再匹配下一个」。\n        for _ in range(k):\n            # 取不到后继（历史里没有这个后缀）就停：宁可少给草稿，也不要瞎猜一个。\n            nxt = self._match_once(history)\n            if nxt is None:\n                break\n            # 一个个累积成草稿列表。\n            out.append(nxt)\n            # ★ 关键一步：把草稿接进 history，让下一轮匹配能利用它。\n            # 没有这一行，多 token 草稿就会退化成\"同一个后继重复 K 次\"。\n            history.append(nxt)\n        return out","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/spec/ngram.py:49"],["src/spec/ngram.py",84,"NgramDrafter._match_once","n-gram 匹配的最长后缀查找","    def _match_once(self, history: list[int]) -> int | None:\n        \"\"\"用最长的可匹配后缀取一个后继 token，取不到返回 None。\"\"\"\n        # 递减遍历：range(max_n, min_n - 1, -1) 生成 max_n, max_n-1, ..., min_n。\n        # 这样第一个成功的匹配就是\"最长的那个后缀\"。\n        for n in range(self.max_n, self.min_n - 1, -1):\n            if len(history) < n + 1:\n                continue\n            # 取当前序列结尾的 n 个 token 作为匹配键。\n            key = tuple(history[-n:])\n            # 在历史里找这个键最后一次出现的位置。\n            # 用\"最后一次\"而不是第一次：离当前越近的重复片段，越可能延续同样的后续\n            # （真实文本里\"最近用过什么\"比\"最早出现过什么\"更相关）。\n            pos = self._last_occurrence(history, key)\n            if pos is not None:\n                # 命中：紧跟在那个位置的键之后的下一个 token 就是草稿。\n                # 注意 pos 是**起点**，所以后继下标是 pos + n。\n                return history[pos + n]\n        return None","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/spec/ngram.py:84"]],"vllm":[["vllm/v1/spec_decode/ngram_proposer.py",12,"NgramProposer","CPU 版 n-gram 草稿：维护历史 token 字典批量 propose","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/spec_decode/ngram_proposer.py:12"],["vllm/v1/spec_decode/ngram_proposer_gpu.py",217,"NgramProposerGPU","GPU 版 n-gram 匹配，把匹配搬进 kernel 减少 host 往返","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/spec_decode/ngram_proposer_gpu.py:217"],["vllm/v1/sample/rejection_sampler.py",38,"RejectionSampler","拒绝采样验证器；forward:92 张量化一次处理全部草稿位置","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/sample/rejection_sampler.py:38"],["vllm/v1/spec_decode/metadata.py",10,"SpecDecodeMetadata","草稿/目标 logits 的批量索引元数据，把变长 缀也累计进去** —— attention 必须看得到全部历史。\n            cu_k[i + 1] = cu_k[i] + end\n            # 记下最长 Q / 最长 K：flash-attn 需要它们来切块。\n            max_q = max(max_q, n)\n            max_k = max(max_k, end)\n            n_tokens += n\n\n        bs = len(seqs)\n        _h2d(self.input_ids, self._pre_ids, n_tokens)\n        _h2d(self.positions, self._pre_pos, n_tokens)\n        _h2d(self.slot_mapping, self._pre_slot, n_tokens)\n    # … 其余略；点「在 VS Code 打开」看全文","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/compute/batch.py:211"]],"vllm":[],"vcmp":[],"doc":{"a":"flowdoc-C0a","sec":"ch-c7-h3-4","sect":"7.2.2 批装配：三层内存与「只写不分配」","cid":"C7","text":"GPU 侧缓冲一次按上限开好、之后永不重新分配（src/compute/batch.py:68），地址固定也是 CG 的前提。 关键代码：src/compute/batch.py:182-197（decode 组包的主循环）。","hl":["batch"],"k":13}},"C0b":{"t":"卡 0 ｜ 查表：只查本卡那半张词表（151936 →两半，末段补零）","c":"C9","n":"模型实现","lab":["卡 0 ｜ 查表：","只查本卡那半张词表（151936 →两半，末段补零）","V=151936,\\quad V/2=75968"],"cite":[["src/compute/layers/vocab_parallel.py",126,"VocabParallelEmbedding","词表并行查表：本卡只查自己那半张（末段补零）","class VocabParallelEmbedding(nn.Module):\n    \"\"\"\n        词表并行 Embedding 层。\n        核心优化：引入 \"+1 哑元行\"，将越界 Token 映射到索引 0。\n        查表操作直接输出全 0 向量，后续只需进行 AllReduce，省去对高维浮点 Tensor\n        进行 Mask 操作，将访存压力从 [B, S, H] 降维到了 [B, S]。\n    \"\"\"\n\n    # 权重实际分配 vocab/tp **+ 1** 行 —— 多出来的那一行就是哑元行。\n    def __init__(self, num_embeddings: int, embedding_dim: int):\n        super().__init__()\n        # 建层时就要确定切法，所以 TP 组必须在模型构建之前初始化好。\n        tp = get_tp_group()\n        self.num_embeddings = num_embeddings\n        self.embedding_dim = embedding_dim\n\n        # 计算对齐后的总词表大小\n        # 先算对齐后的**总**词表大小：所有 rank 用同一个值，才能算出彼此一致的边界。\n        # 计算对齐后的总词表大小\n        padded = _pad_vocab_size(num_embeddings, tp.size)\n\n        # 计算当前 Rank 负责的词表 ID 范围 [start, end)\n        self.vocab_start_index, self.vocab_end_index = self._vocab_range(\n            padded // tp.size, tp\n        )\n\n        # 分配权重：大小比 per_partition 多 1 行。第 0 行是永远为 0 的哑元行 (Dummy Row)\n        self.weight = nn.Parameter(\n            torch.zeros(padded // tp.size + 1, embedding_dim)\n        )\n        # 绑定权重加载回调\n        setattr(self.weight, \"weight_loader\", self.weight_loader)\n\n    def _vocab_range(self, per_partition: int, tp) -> tuple[int, int]:\n        \"\"\"计算当前 Rank 负责的词表 ID 边界。\"\"\"\n        return (\n            per_partition * tp.group_rank,\n            per_partition * (tp.group_rank + 1),\n        )\n    # … 其余略；点「在 VS Code 打开」看全文","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/compute/layers/vocab_parallel.py:126"],["src/compute/layers/vocab_parallel.py",60,"_pad_vocab_size","151936 → 补到可分片","def _pad_vocab_size(vocab_size: int, tp_size: int, *, multiple: int = 16) -> int:\n    \"\"\"\n        计算填充后的词表总大小。\n        保证能被 tp_size 整除，并且每个 Rank 分到的词表大小是 multiple (如 16) 的倍数，\n        确保契合 NVIDIA GPU Tensor Cores 的矩阵乘法对齐要求，最大化算力利用率。\n    \"\"\"\n    # 1. 计算每个 Rank 基础需要处理的词表大小 (向上取整)\n    # 第一步：按 tp 均分，向上取整。\n    # 1. 计算每个 Rank 基础需要处理的词表大小 (向上取整)\n    per = (vocab_size + tp_size - 1) // tp_size\n    # 2. 向上取整到 multiple 的倍数\n    # 第二步：把每卡分片再对齐到 multiple —— 对齐之后 GEMM 才走 Tensor Core 的快路径。\n    # 2. 向上取整到 multiple 的倍数\n    per = ((per + multiple - 1) // multiple) * multiple\n    # 3. 返回填充后的总词表大小\n    # 第三步：乘回总数。注意返回值比真实 vocab 大（多出来的是 padding 行）。\n    # 3. 返回填充后的总词表大小\n    return per * tp_size","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/compute/layers/vocab_parallel.py:60"]],"vllm":[],"vcmp":[],"doc":{"a":"flowdoc-C0b","sec":"ch-c8-h3-10","sect":"8.2.8 词表并行与出口：embedding 的哑元行、logits 的 gather 与 argmax 的两条路","cid":"C8","text":"在干什么：入口 VocabParallelEmbedding 只持有 vocab/tp 行，越界 token 查表拿到 0 向量、靠 all-reduce 求和补回正确性；","hl":["vocabparallelembedding","查表"],"k":38}},"C0c":{"t":"卡 0 ｜ norm①：作用在完整 hidden 上 ⇒ 零通信","c":"C8","n":"算子与层","lab":["卡 0 ｜ norm①：作用在完整 hidden 上 ⇒ 零通信","\\mathrm{RMSNorm}(h)=h\\,w/\\sqrt{\\mathrm{mean}(h^{2})+\\epsilon}"],"cite":[["src/compute/layers/layernorm.py",40,"RMSNorm.forward","norm①：作用在完整 hidden 上 ⇒ 零通信","    def forward(self, x: torch.Tensor, residual: torch.Tensor | None = None) -> tuple[torch.Tensor, torch.Tensor]:\n        # 普通模式：没有残差基线（第一次调用时就是这种）。\n        # 返回的第二个值是 x 本身 —— 它将成为后续的残差基线。\n        if residual is None:\n            # 融合模式：一步完成\"相加 + 归一化\"。\n            return _rmsnorm(x, self.weight, self.eps), x\n        # 注意这里没有赋值语句：两个张量是**被原地改写**的，\n        # x 现在是归一化结果、residual 现在是 (旧 x + 旧 residual)。\n        # 写成 x = ... 反而是错的（那会丢掉原地写的结果）。\n        _fused_add_rmsnorm(x, residual, self.weight, self.eps)\n        return x, residual","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/compute/layers/layernorm.py:40"]],"vllm":[["vllm/model_executor/layers/layernorm.py",37,"RMSNorm","CustomOp 版 RMSNorm：forward_native:74 / forward_cuda:96 各有实现","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/layernorm.py:37"],["vllm/model_executor/layers/activation.py",112,"SiluAndMul","CustomOp 激活，含 forward_cuda；同文件 MulAndSilu:261 是相反布局","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/activation.py:112"],["vllm/model_executor/layers/rotary_embedding/base.py",15,"RotaryEmbeddingBase","RoPE 基类：init_cache:58、forward_cuda:221；按平台分 14 个变体","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/rotary_embedding/base.py:15"],["vllm/model_executor/layers/rotary_embedding/common.py",125,"ApplyRotaryEmb","独立的「应用旋转」CustomOp，支持 is_neox_style 与是否包 cos/sin","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/rotary_embedding/common.py:125"],["vllm/model_executor/layers/fused_qk_norm_rope.py",138,"fused_qk_rmsnorm_rope_gate","把 q/k 的 RMSNorm 与 RoPE 融成一个 kernel，省一次访存","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/m    self.num_kv_head_replicas = divide(tp_size, total_num_kv_heads)\n        else:\n            self.num_kv_heads = divide(total_num_kv_heads, tp_size)\n            self.num_kv_head_replicas = 1\n    # … 其余略；点「在 VS Code 打开」看全文","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/compute/layers/linear.py:321"],["src/compute/layers/linear.py",377,"QKVParallelLinear._shard_qkv","按头数分片（8 Q 头 / 4 KV 头）","    def _shard_qkv(\n        self, loaded_weight: torch.Tensor, shard_id: str","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/compute/layers/linear.py:377"]],"vllm":[["vllm/model_executor/layers/linear.py",125,"LinearMethodBase","线性层方法插拔基类，量化/非量化实现统一 apply 入口","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/linear.py:125"],["vllm/model_executor/layers/linear.py",239,"LinearBase","所有线性层公共基类：管 bias、输出 size 分区、量化方法","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/linear.py:239"],["vllm/model_executor/layers/linear.py",320,"ReplicatedLinear","每卡完整权重、无通信（router/gate 用）","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/linear.py:320"],["vllm/model_executor/layers/linear.py",425,"ColumnParallelLinear","切输出维；forward:593 按 gather_output 决定要不要 all_gather","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/linear.py:425"],["vllm/model_executor/layers/linear.py",1617,"RowParallelLinear","切输入维；forward:1748 按 reduce_results/input_is_parallel 决定 all_reduce","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/linear.py:1617"],["vllm/model_executor/layers/linear.py",989,"QKVParallelLinear","Q/K/V 打包切分；KV 头不够 tp 时在 rank 间复制 KV 头","vsco eshape 后就放着了。\n        q, k = self.rotary_emb(positions, q, k)\n        return q, k, v","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/compute/models/qwen3.py:168"],["src/compute/layers/rotary.py",84,"RotaryEmbedding.forward","RoPE 本体","    def forward(\n        self,\n        # 因为前缀命中时位置不从 0 开始，要从命中的长度接着数。\n        positions: torch.Tensor,\n        query: torch.Tensor,\n        key: torch.Tensor,","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/compute/layers/rotary.py:84"]],"vllm":[["vllm/model_executor/layers/layernorm.py",37,"RMSNorm","CustomOp 版 RMSNorm：forward_native:74 / forward_cuda:96 各有实现","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/layernorm.py:37"],["vllm/model_executor/layers/activation.py",112,"SiluAndMul","CustomOp 激活，含 forward_cuda；同文件 MulAndSilu:261 是相反布局","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/activation.py:112"],["vllm/model_executor/layers/rotary_embedding/base.py",15,"RotaryEmbeddingBase","RoPE 基类：init_cache:58、forward_cuda:221；按平台分 14 个变体","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/rotary_embedding/base.py:15"],["vllm/model_executor/layers/rotary_embedding/common.py",125,"ApplyRotaryEmb","独立的「应用旋转」CustomOp，支持 is_neox_style 与是否包 cos/sin","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/rotary_embedding/common.py:125"],["vllm/model_executor/layers/fused_qk_norm_rope.py",138,"fused_qk_rmsnorm_rope_gate","把 q/k 的 RMSNorm 与 RoPE 融成一个 kernel，省一次访存","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/fused_qk_norm_rope.py:138"]],"vcmp":["都只做 RMS 缩放不做均值中心化、都用 fp32 的 cos/sin ,"vLLM 把注意力拆成「后端枚举 + 选择器 + 层内 use_direct_call 切换」的三层结构，且有 FA/FlashInfer/Triton 多后端；我们只有 attention.py:78 一个手写 attention()，写死 flash_attn_varlen_func / flash_attn_with_kvcache，靠 block_tables 是不是 None 来分流。"],"doc":{"a":"flowdoc-C0g","sec":"ch-c8-h3-7","sect":"8.2.5 attention：先写 KV、再算注意力，两条接口一把算子","cid":"C8","text":"o = flash_attn_varlen_func(q, k, v, cu_seqlens_q=..., cu_seqlens_k=...,","hl":[],"k":27}},"C0h":{"t":"卡 0 ｜ o_proj（行并行，切求和维）⇒ 只有部分和","c":"C8","n":"算子与层","lab":["卡 0 ｜ o_proj（行并行，切求和维）⇒ 只有部分和","y=y^{(0)}+y^{(1)}"],"cite":[["src/compute/layers/linear.py",302,"RowParallelLinear.forward","o_proj 行并行：只有部分和，所以要 allreduce","    def forward(self, x: torch.Tensor) -> torch.Tensor:\n        if not self.input_is_parallel and self._tp_size > 1:\n            shard = self.input_size_per_partition\n            x = x.narrow(-1, self._tp_rank * shard, shard).contiguous()\n        # 局部计算\n        # 局部 GEMM：形状 [.., out]，但每张卡算出来的是**部分和**。\n        out = torch.nn.functional.linear(x, self.weight)\n        if self.reduce_results and self._tp_size > 1:\n            # 跨 TP 通信，将所有 Rank 的局部输出拼接为完整输出\n            # 关键一步：各卡的部分和相加才是完整结果。行并行的通信就在这一行。\n            out = tensor_model_parallel_all_reduce(out)\n        # 加上偏置\n        # bias 必须在 all-reduce **之后**加：提前加会被累加 tp 次。\n        if self.bias is not None:\n            out = out + self.bias\n        return out","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/compute/layers/linear.py:302"],["src/compute/layers/linear.py",247,"RowParallelLinear","切输入维 / 求和维","class RowParallelLinear(nn.Module):\n    \"\"\"\n        输入并行\n\n        【数学原理】\n        权重 W 按照输出维度（第1维）切分， W ∈ R^(out x in)，切分为W_i ∈ R^(out x (in/TP))。\n\n        【使用场景】\n        通常紧跟在 ColumnParallelLinear 之后（例如 FFN 的 down_proj 或 Attention 的 out_proj）。\n        输出前 all-reduce 求和，确保各 rank 的输出累加为全局输出。\n    \"\"\"\n\n    def __init__(\n        self,\n        in_size: int,\n        out_size: int,\n        *,\n        bias: bool = False,\n        input_is_parallel: bool = False,\n        reduce_results: bool = True,\n        tp_size: int | None = None,\n    ):\n        super().__init__()\n        self.in_size = in_size\n        self.out_size = out_size\n        # input_is_parallel 仅决定 forward 是否还需 scatter 输入，不影响权重形状。\n        self.input_is_parallel = input_is_parallel\n        self.reduce_results = reduce_results\n        self._tp_size, self._tp_rank = _tp_meta(tp_size)\n        self.input_size_per_partition = divide(in_size, self._tp_size)\n        # 权重形状 [out, in/tp]。输出维是**全量**的 —— 所以行并行的单卡输出只是「部分和」。\n        self.weight = nn.Parameter(\n            torch.empty(out_size, self.input_size_per_partition)\n        )\n        # 行并行的Bias是全量持有\n        if bias:\n            self.bias = nn.Parameter(torch.empty(out_size))\n            setattr(self.bias, \"weight_loader\", self.weight_loader)\n        else:\n            self.register_parameter(\"bias\", None)\n    # … 其余略；点「在 VS Code 打开」看全文","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/compute/layers/linear.py:247"]],"vllm":[["vllm/model_executor/layers/linear.py",125,"LinearMethodBase","线性层方法插拔基类，量化/非量化实现统一 apply 入口","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/linear.py:125"],["vllm/model_executor/layers/linear.py",239,"LinearBase","所有线性层公共基类：管 bias、输出 size 分区、量化方法","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/linear.py:239"],["vllm/model_executor/layers/linear.py",320,"ReplicatedLinear","每卡完整权重、无通信（router/gate 用）","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/linear.py:320"],["vllm/model_executor/layers/linear.py",425,"ColumnParallelLinear","切输出维；forward:593 按 gather_output 决定要不要 all_gather","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/linear.py:425"],["vllm/model_executor/layers/linear.py",1617,"RowParallelLinear","切输入维；forward:1748 按 reduce_results/input_is_parallel 决定 all_reduce","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/linear.py:1617"],["vllm/model_executor/layers/linear.py",989,"QKVParallelLinear","Q/K/V 打包切分；KV 头不够 tp 时在 rank 间复制 KV 头","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/linear.py:989"],["vllm/model_executor/layers/linear.py",663,"MergedColumnParallelLinear","多个输出段合并成一列并行（gate/up），按 shard_id 偏移装载","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/linear.py:663"]],"vcmp":["同一套判据：可切的输出维走列并行，需要跨卡求和的走行并行；门/路由用复制层保证各 rank 结果一致。","vLLM 每个层都要过 LinearMethodBase（量化方法可插拔），forward 里用 self.quant_method.apply 统一执行；我们 linear.py:101 的 _shard 在 __init__ 里直接 narrow 权重，forward 手写 F.linear + all_gather/all_reduce，没有方法插拔这一层。"],"doc":{"a":"flowdoc-C0h","sec":"ch-c8-h3-8","sect":"8.2.6 输出投影与 FFN：TP 的一对\"切-合\"","cid":"C8","text":"在干什么：attention 的输出经过 o_proj（行并行，输入已经是分片状态），MLP 走 gate_up_proj（融合列并行）→ SiluAndMul → down_proj（行并行）。 关键代码（src/compute/layers/linear.py:302-317）：","hl":["行并行"],"k":30}},"C0i":{"t":"卡 0 ｜ 残差 + norm②","c":"C8","n":"算子与层","lab":["卡 0 ｜ 残差 + norm②"],"cite":[["src/compute/models/qwen3.py",222,"Qwen3DecoderLayer.forward","残差 + norm② 的编排","    def forward(self, positions, hidden_states, residual: torch.Tensor | None, attn: AttnInputs):\n        # 输入处融合：h_new = RMSNorm(h + residual)。residual 被原地更新为 (h + residual)。\n        hidden_states, residual = self.input_layernorm(hidden_states, residual)\n        # attention 里会写 KV、调 flash-attn；它的输出已经是 hidden 形状。\n        hidden_states = self.self_attn(positions, hidden_states, attn)\n        # 第二个融合点：把 attention 输出加回残差基线，再归一化给 MLP 用。\n        # 注意这里是\"先加残差再归一化\"，与第一处语义相同；\n        # 如果写成\"归一化后再加残差\"就是 Post-LN，数值会完全不一样。\n        hidden_states, residual = self.post_attention_layernorm(hidden_states, residual)\n        # 返回的是 (MLP 输出, 残差基线) 两个值，且**没有做最后的相加** ——\n        # 相加留给下一层的 input_layernorm 融合完成。最后一层则由最后的 self.norm 收尾。\n        # 这个\"延迟相加\"的设计是为了让每一处相加都能被融合掉。\n        return self.mlp(hidden_states), residual","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/compute/models/qwen3.py:222"]],"vllm":[["vllm/model_executor/models/qwen3.py",65,"Qwen3Attention","q/k/v 拆分 → q_norm/k_norm:150/151 → RoPE → attn，与我们的顺序完全一致","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/models/qwen3.py:65"],["vllm/model_executor/models/qwen3.py",173,"Qwen3DecoderLayer","pre-LN 层：input_layernorm / self_attn / post_attention_layernorm / mlp","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/models/qwen3.py:173"],["vllm/model_executor/models/qwen3.py",264,"Qwen3Model","继承 Qwen2Model，复用 PP 切层、embedding 与中间张量逻辑","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/models/qwen3.py:264"],["vllm/model_executor/models/qwen3.py",271,"Qwen3ForCausalLM","挂 lm_head 并调 logits_processor，只对需要的位置算 logits","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/models/qwen3.py:271"],["vllm/model_executor/layers/logits_processor.py",58,"LogitsProcessor","只 gather 选中位置的 hidden 再过 lm_head，避免全量算词表投影","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/logits_processor.py:58"]],"vcmp":["结构、层循环、q/k 头内 RMSNorm、只对末尾 logits 位置做 lm_head 的思路都是一样的。","vLLM 的 Qwen3Model 复用 Qwen2Model 的通用 PP/embedding 骨架，位置选取交给可插拔的 LogitsProcessor 层，lm_head 是 ParallelLMHead + LogitsProcessor；我们是 qwen3.py:271 自己写 forward，在 runner 里用 cu_seqlens_q[1:bs+1]-1 选位置。"],"doc":{"a":"flowdoc-C0i","sec":"ch-c8-h3-4","sect":"8.2.2 残差 + RMSNorm：把\"相加\"和\"归一化\"融成一次原地写","cid":"C8","text":"为什么这么写 / 替代方案 / 代价：RMSNorm 相比 LayerNorm 少了求均值与减均值（src/compute/layers/layernorm.py:4-6），而 decode 每步都要把全部归一化层过一遍，省下的是纯访存。","hl":[],"k":16}},"C0j":{"t":"卡 0 ｜ router（复制权重）→top-k →","c":"C10","n":"MoE 与专家并行","lab":["卡 0 ｜ router（复制权重）→top-k →","本卡专家切片 ⇒ 部分和 非 EP：按中间维切；EP：","按专家轴切（每卡算全部 token、只算自己专家）","m=\\textstyle\\sum_{e}g_{e}E_{e}(x)"],"cite":[["src/moe/block.py",150,"SparseMoeBlock.forward","router → top-k → 本卡专家切片 ⇒ 部分和","    def forward(self, hidden_states: torch.Tensor) -> torch.Tensor:\n        orig_shape = hidden_states.shape\n        # 把可能带 batch 维的形状压成 [T, H]：MoE 只在 token 维上做事。\n        # 最后再 view 回原形状 —— 这样上一层不需要知道 MoE 内部是几维。\n        hidden = hidden_states.view(-1, orig_shape[-1])\n        topk_weights, topk_ids = route_experts(\n            self.gate(hidden), self.top_k, norm_topk_prob=self.norm_topk_prob\n        )\n        # 到这里 out 是**局部和**：EP 下只含本卡专家的贡献，TP 下只含中间维分片的贡献。\n        # 两种情况都需要一次跨卡归约，但\"何时归约\"取决于共享专家是否完整（见下）。\n        out = self.experts(hidden, topk_ids, topk_weights)\n        # 判断标准是 **TP 组的 size**（不是 ep）：EP 只是在同一组 rank 上改切法，\n        # 组本身没变 —— 所以 EP 下这里同样为 True，仍然要 AR。\n        need_ar = get_tp_group().size > 1\n        # ★ EP：先把 routed 的局部和归约成全局，再加共享专家。\n        # 若顺序反过来，共享专家（每卡完整一份）会被求和 ep 次 ⇒ 数值偏大 ep 倍。\n        if self.use_ep:\n            if need_ar:\n                out = tensor_model_parallel_all_reduce(out)\n            if self.shared_expert_gate_up is not None:\n                out = out + self._shared_expert(hidden)\n        else:\n            if self.shared_expert_gate_up is not None:\n                out = out + self._shared_expert(hidden)\n            if need_ar:\n                out = tensor_model_parallel_all_reduce(out)\n        # 恢复成进来时的形状（可能带 batch 维），交给下一层。\n        return out.view(orig_shape)","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzy → 卡 2","c":"C7","n":"计算路径","lab":["卡 0 ｜ 本段结束：send h 与 residual → 卡 2"],"cite":[["src/compute/model_runner.py",170,"ModelRunner._send_intermediate","send h 与 residual → 卡 2","    def _send_intermediate(self, out: IntermediateTensors) -> None:\n        send_tensors(\n            (out[\"hidden_states\"], out[\"residual\"]),\n            self._pp_dst(),\n            self._pp_group,\n        )","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/compute/model_runner.py:170"],["src/distributed/communication_op.py",145,"send_tensors","PP 点对点发送","def send_tensors(\n    tensors: tuple[torch.Tensor, ...] | list[torch.Tensor],\n    dst: int,\n    group: Group | None = None,","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/distributed/communication_op.py:145"]],"vllm":[["vllm/v1/worker/gpu_worker.py",1109,"execute_model","worker 侧一步执行：中间张量收/发 + 采样结果回传","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/worker/gpu_worker.py:1109"],["vllm/distributed/parallel_state.py",411,"GroupCoordinator","通信组抽象；send_tensor_dict:1048 / recv_tensor_dict:1213 传变长张量字典","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/distributed/parallel_state.py:411"],["vllm/distributed/parallel_state.py",952,"broadcast_tensor_dict","把张量字典广播给全组（含采样结果回传非末段）","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/distributed/parallel_state.py:952"],["vllm/v1/worker/gpu_model_runner.py",4249,"execute_model","runner 侧 PP 编排：收中间张量 → 跑模型 → 发中间张量/广播采样","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/worker/gpu_model_runner.py:4249"]],"vcmp":["都是 lockstep：各 stage 每步各跑自己那段层，PP 边界只传 hidden（IntermediateTensors），末段才出 token。","vLLM 传的是变长 tensor dict（除 residual 外还有元数据），并有 irecv/isend 异步版与 broadcast 把采样 id 广播回所有 stage；我们 model_runner.py:150 f run_forward(self, sched: SchedulerOutput):\n        \"\"\"一步 sync 前向：decode 再 prefill；PP 为 lockstep 切层，非 1F1B。\n\n        非末 PP stage 只做本段计算 + P2P，返回 None；末 stage 异步 D2H 采样 id。\n        \"\"\"\n        # prefill 与 decode 可以同时存在（连续批处理的体现）：新请求进 prefill、\n        # 老请求接着 decode，两批分别跑，最后把返回的 id 合到一起。\n        # 两批分开跑：deocde 每条 1 个 token、prefill 每条多个 token，形状本就不同。\n        d = self._run_decode(sched.decodes) if sched.decodes else None\n        # 同一轮里 prefill 与 decode 各跑一次 —— 这就是连续批处理的体现。\n        p = self._run_prefill(sched.prefills) if sched.prefills else None\n        # 非末段没有输出（logits 与采样都在末段），直接返回 None。\n        if not self.is_last_pp:\n            return None\n        # 末段才做异步 D2H：这里只排队，真正取数交给 read_samples。\n        return self._stage_samples(p, d)","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/compute/model_runner.py:188"]],"vllm":[],"vcmp":[],"doc":{"a":"flowdoc-C1a","sec":"ch-c7-h3-4","sect":"7.2.2 批装配：三层内存与「只写不分配」","cid":"C7","text":"src/compute/batch.py:2-11 说明了为什么是三层内存：numpy 视图 → pinned CPU 缓冲 → GPU 张量。","hl":[],"k":13}},"C1b":{"t":"卡 1 ｜ 查表：另外半张词表（词表后半）","c":"C9","n":"模型实现","lab":["卡 1 ｜ 查表：另外半张词表（词表后半）","V_{\\mathrm{half}}=75968"],"cite":[["src/compute/layers/vocab_parallel.py",159,"VocabParallelEmbedding._vocab_range","本卡负责的词表区间（后半张）","    def _vocab_range(self, per_partition: int, tp) -> tuple[int, int]:\n        \"\"\"计算当前 Rank 负责的词表 ID 边界。\"\"\"\n        return (\n            per_partition * tp.group_rank,\n            per_partition * (tp.group_rank + 1),\n        )","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/compute/layers/vocab_parallel.py:159"]],"vllm":[],"vcmp":[],"doc":{"a":"flowdoc-C1b","sec":"ch-c8-h3-10","sect":"8.2.8 词表并行与出口：embedding 的哑元行、logits 的 gather 与 argmax 的两条路","cid":"C8","text":"在干什么：入口 VocabParallelEmbedding 只持有 vocab/tp 行，越界 token 查表拿到 0 向量、靠 all-reduce 求和补回正确性；","hl":["vocabparallelembedding","查表"],"k":38}},"C1c":{"t":"卡 1 ｜ norm①：作用在完整 hidden 上","c":"C8","n":"算子与层","lab":["卡 1 ｜ norm①：作用在完整 hidden 上","\\mathrm{RMSNorm}(h)"],"cite":[["src/compute/layers/layernorm.py",40,"RMSNorm.forward","norm①：与卡 0 同一份完整 hidden","    def forward(self, x: torch.Tensor, residual: torch.Tensor | None = None) -> tuple[torch.Tensor, torch.Tensor]:\n        # 普通模式：没有残差基线（第一次调用时就是这种）。\n        # 返回的第二个值是 x 本身 —— 它将成为后续的残差基线。\n        if residual is None:\n            # 融合模式：一步完成\"相加 + 归一化\"。\n            return _rmsnorm(x, self.weight, self.eps), x\n        # 注意这里没有赋值语句：两个张量是**被原地改写**的，\n        # x 现在是归一化结果、residual 现在是 (旧 x + 旧 residual)。\n        # 写成 x = ... 反而是错的（那会丢掉原地写的结果）。\n        _fused_add_rmsnorm(x, residual, self.weight, self.eps)\n        return x, residual","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/compute/layers/layernorm.py:40"]],"vllm":[["vllm/model_executor/layers/layernorm.py",37,"RMSNorm","CustomOp 版 RMSNorm：forward_native:74 / forward_cuda:96 各有实现","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/layernorm.py:37"],["vllm/model_executor/layers/activation.py",112,"SiluAndMul","CustomOp 激活，含 forward_cuda；同文件 MulAndSilu:261 是相反布局","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/activation.py:112"],["vllm/model_executor/layers/rotary_embedding/base.py",15,"RotaryEmbeddingBase","RoPE 基类：init_cache:58、forward_cuda:221；按平台分 14 个变体","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/rotary_embedding/base.py:15"],["vllm/model_executor/layers/rotary_embedding/common.py",125,"ApplyRotaryEmb","独立的「应用旋转」CustomOp，支持 is_neox_style 与是否包 cos/sin","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/rotary_embedding/common.py:125"],["vllm/model_executor/layers/fused_qk_norm_rope.py",138,"fused_qk_rmsnorm_rope_gate","把 q/k 的 RMSNorm 与 RoPE 融成一个 kernel，省一次访存","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/fused_qk_norm_rope.py:138"]],"vcmp":["都只做 RMS 缩放不做均值中心化、都用 fp32 的 cos/sin 表且要求 NeoX 半切分、都把残差加与 norm 融合。","vLLM 用 CustomOp 体系（forward_native/forward_cuda/forward_hip 多实现），并额外提供 qk-norm + rope 融合算子和前缀/交错式 RoPE；我们把 FlashInfer 原语包成 torch.library.custom_op（ops.py:22/37/81/96）自己声明 mutates_args，没有多平台实现。"],"doc":{"a":"flowdoc-C1c","sec":"ch-c8-h3-4","sect":"8.2.2 残差 + RMSNorm：把\"相加\"和\"归一化\"融成一次原地写","cid":"C8","text":"if residual is None: return _rmsnorm(x, self.weight, self.eps), x","hl":["rmsnorm"],"k":15}},"C1d":{"t":"卡 1 ｜ qkv_proj（列并行）","c":"C8","n":"算子与层","lab":["卡 1 ｜ qkv_proj（列并行）：","另外 8 个 Q 头、","4 个 KV 头","q:[N,8,128]"],"cite":[["src/compute/layers/linear.py",321,"QKVParallelLinear","另外 8 个 Q 头、4 个 KV 头就在这一层里","class QKVParallelLinear(nn.Module):\n    \"\"\"\n    融合 QKV 投影层\n\n    【设计目的】\n    将 Query, Key, Value 的投影矩阵融合为一个大矩阵，减少 Kernel Launch 次数，提高显存带宽利用率。\n\n    【特性】\n    支持 MHA、MQA 和 GQA。\n    当 KV Head 数量小于 TP Size 时，会自动在多个 Rank 之间复制 KV Head。\n    \"\"\"\n\n    def __init__(\n        self,\n        hidden_size: int,\n        head_size: int,\n        total_num_heads: int,\n        total_num_kv_heads: int,\n        *,\n        bias: bool = False,\n    ):\n        super().__init__()\n        tp_size = get_tp_group().size\n        self.hidden_size = hidden_size\n        self.head_size = head_size\n        self.num_heads_total = total_num_heads\n        self.num_kv_heads_total = total_num_kv_heads\n        # Q 均分到每个 rank\n        self.num_heads = divide(total_num_heads, tp_size)\n        # 处理 KV Head 数量小于 TP Size 的情况\n        # 处理办法不是报错，而是让多张卡**共享同一个 KV 头**（各自持一份相同的权重）。\n        if tp_size > total_num_kv_heads:\n            self.num_kv_heads = 1\n            # 记录每个 KV Head 需要被复制的次数 (例如 2个KV Head, 4个Rank -> 每个复制 2 次)\n            # 每个 KV 头要复制给几个 rank：tp=4 / nkv=2 → 每个头 2 份。\n            # 记录每个 KV Head 需要被复制的次数 (例如 2个KV Head, 4个Rank -> 每个复制 2 次)\n            self.num_kv_head_replicas = divide(tp_size, total_num_kv_heads)\n        else:\n            self.num_kv_heads = divide(total_num_kv_heads, tp_size)\n            self.num_kv_head_replicas = 1\n    # … 其余略；点「在 VS Code 打开」看全文","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/compute/layers/linear.py:321"]],"vllm":[["vllm/model_executor/layers/linear.py",125,"LinearMethodBase","线性层方法插拔基类，量化/非量化实现统一 apply 入口","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/linear.py:125"],["vllm/model_executor/layers/linear.py",239,"LinearBase","所有线性层公共基类：管 bias、输出 size 分区、量化方法","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/linear.py:239"],["vllm/model_executor/layers/linear.py",320,"ReplicatedLinear","每卡完整权重、无通信（router/gate 用）","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/linear.py:320"],["vllm/model_executor/layers/linear.py",425,"ColumnParallelLinear","切输出维；forward:593 按 gather_output 决定要不要 all_gather","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/linear.py:425"],["vllm/model_executor/layers/linear.py",1617,"RowParallelLinear","切输入维；forward:1748 按 reduce_results/input_is_parallel 决定 all_reduce","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/linear.py:1617"],["vllm/model_executor/layers/linear.py",989,"QKVParallelLinear","Q/K/V 打包切分；KV 头不够 tp 时在 rank 间复制 KV 头","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/linear.py:989"],["vllm/model_executor/layers/linear.py",663,"MergedCol out = tensor_model_parallel_all_reduce(out)\n        # 恢复成进来时的形状（可能带 batch 维），交给下一层。\n        return out.view(orig_shape)","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/moe/block.py:150"]],"vllm":[["vllm/model_executor/layers/fused_moe/layer.py",88,"FusedMoEFactory","0.29.0 改名后的入口，内部组装 router/kernel/runner 并返回 MoERunner","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/fused_moe/layer.py:88"],["vllm/model_executor/layers/fused_moe/fused_moe.py",1593,"fused_experts","Triton 融合专家前向：对齐 → 分组 GEMM → 加权归约一条链","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/fused_moe/fused_moe.py:1593"],["vllm/model_executor/layers/fused_moe/fused_moe.py",913,"dispatch_fused_moe_kernel","按 M/专家数/量化类型查配置并派发具体 kernel","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/fused_moe/fused_moe.py:913"],["vllm/model_executor/layers/fused_moe/moe_align_block_size.py",11,"moe_align_block_size","把不等长的 token→专家 映射补零对齐到 block，供分组 GEMM 用","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/fused_moe/moe_align_block_size.py:11"],["vllm/model_executor/layers/fused_moe/router/fused_topk_router.py",80,"fused_topk","router logits→softmax→topk→归一化，融合成一次调用","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/fused_moe/router/fused_topk_router.py:80"],["vllm/model_executor/layers/fused_moe/router/grouped_topk_router.py",80,"grouped_topk","分组 top-k：先按组打分选出 top 组再在组内选专家（DeepSeek 系）","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/fused_moe/router/grouped_topk_router.py:80"],["vllm/model_executor/ al_num_kv_heads: int,\n        *,\n        bias: bool = False,\n    ):\n        super().__init__()\n        tp_size = get_tp_group().size\n        self.hidden_size = hidden_size\n        self.head_size = head_size\n        self.num_heads_total = total_num_heads\n        self.num_kv_heads_total = total_num_kv_heads\n        # Q 均分到每个 rank\n        self.num_heads = divide(total_num_heads, tp_size)\n        # 处理 KV Head 数量小于 TP Size 的情况\n        # 处理办法不是报错，而是让多张卡**共享同一个 KV 头**（各自持一份相同的权重）。\n        if tp_size > total_num_kv_heads:\n            self.num_kv_heads = 1\n            # 记录每个 KV Head 需要被复制的次数 (例如 2个KV Head, 4个Rank -> 每个复制 2 次)\n            # 每个 KV 头要复制给几个 rank：tp=4 / nkv=2 → 每个头 2 份。\n            # 记录每个 KV Head 需要被复制的次数 (例如 2个KV Head, 4个Rank -> 每个复制 2 次)\n            self.num_kv_head_replicas = divide(tp_size, total_num_kv_heads)\n        else:\n            self.num_kv_heads = divide(total_num_kv_heads, tp_size)\n            self.num_kv_head_replicas = 1\n    # … 其余略；点「在 VS Code 打开」看全文","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/compute/layers/linear.py:321"]],"vllm":[["vllm/model_executor/layers/linear.py",125,"LinearMethodBase","线性层方法插拔基类，量化/非量化实现统一 apply 入口","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/linear.py:125"],["vllm/model_executor/layers/linear.py",239,"LinearBase","所有线性层公共基类：管 bias、输出 size 分区、量化方法","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/linear.py:239"],["vllm/model_executor/layers/linear.py",320,"ReplicatedLinear","每卡完整权重、无通信（router/gate 用）","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/linear.py:320"],["vllm/model_executor/layers/linear.py",425,"ColumnParallelLinear","切输出维；forward:593 按 gather_output 决定要不要 all_gather","vscode://vscode-remote/wsl+Ubuntu/ , H]：MoE 只在 token 维上做事。\n        # 最后再 view 回原形状 —— 这样上一层不需要知道 MoE 内部是几维。\n        hidden = hidden_states.view(-1, orig_shape[-1])\n        topk_weights, topk_ids = route_experts(\n            self.gate(hidden), self.top_k, norm_topk_prob=self.norm_topk_prob\n        )\n        # 到这里 out 是**局部和**：EP 下只含本卡专家的贡献，TP 下只含中间维分片的贡献。\n        # 两种情况都需要一次跨卡归约，但\"何时归约\"取决于共享专家是否完整（见下）。\n        out = self.experts(hidden, topk_ids, topk_weights)\n        # 判断标准是 **TP 组的 size**（不是 ep）：EP 只是在同一组 rank 上改切法，\n        # 组本身没变 —— 所以 EP 下这里同样为 True，仍然要 AR。\n        need_ar = get_tp_group().size > 1\n        # ★ EP：先把 routed 的局部和归约成全局，再加共享专家。\n        # 若顺序反过来，共享专家（每卡完整一份）会被求和 ep 次 ⇒ 数值偏大 ep 倍。\n        if self.use_ep:\n            if need_ar:\n                out = tensor_model_parallel_all_reduce(out)\n            if self.shared_expert_gate_up is not None:\n                out = out + self._shared_expert(hidden)\n        else:\n            if self.shared_expert_gate_up is not None:\n                out = out + self._shared_expert(hidden)\n            if need_ar:\n                out = tensor_model_parallel_all_reduce(out)\n        # 恢复成进来时的形状（可能带 batch 维），交给下一层。\n        return out.view(orig_shape)","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/moe/block.py:150"]],"vllm":[["vllm/model_executor/layers/fused_moe/layer.py",88,"FusedMoEFactory","0.29.0 改名后的入口，内部组装 router/kernel/runner 并返回 MoERunner","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/fused_moe/layer.py:88"],["vllm/model_executor/layers/fused_moe/fused_moe.py",1593,"fused_experts","Triton 融合专家前向：对齐 → 分组 GEMM → 加权归约一条链","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/fused_moe/fused_moe.py:1593"],["vllm/model_executor/layers/fused_moe/fused_moe.py",913,"dispatch_fused_moe_kernel","按 M/专家数/量化类型查配置并派发具体 kernel","vscode://vscode-remote/ =h, residual=r)","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/compute/model_runner.py:178"]],"vllm":[["vllm/v1/worker/gpu_worker.py",1109,"execute_model","worker 侧一步执行：中间张量收/发 + 采样结果回传","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/worker/gpu_worker.py:1109"],["vllm/distributed/parallel_state.py",411,"GroupCoordinator","通信组抽象；send_tensor_dict:1048 / recv_tensor_dict:1213 传变长张量字典","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/distributed/parallel_state.py:411"],["vllm/distributed/parallel_state.py",952,"broadcast_tensor_dict","把张量字典广播给全组（含采样结果回传非末段）","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/distributed/parallel_state.py:952"],["vllm/v1/worker/gpu_model_runner.py",4249,"execute_model","runner 侧 PP 编排：收中间张量 → 跑模型 → 发中间张量/广播采样","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/worker/gpu_model_runner.py:4249"]],"vcmp":["都是 lockstep：各 stage 每步各跑自己那段层，PP 边界只传 hidden（IntermediateTensors），末段才出 token。","vLLM 传的是变长 tensor dict（除 residual 外还有元数据），并有 irecv/isend 异步版与 broadcast 把采样 id 广播回所有 stage；我们 model_runner.py:150 的 _make_pp_buffer 固定只传 hidden_states 与 residual 两个张量、同步 send/recv，非末段没有 lm_head，也不是 1F1B。"],"doc":{"a":"flowdoc-C3a","sec":"ch-c3-h3-9","sect":"3.2.7 PP 边界：收发为什么留在图外","cid":"C3","text":"ModelRunner 侧的落点是 _pp_dst / _pp_src（src/compute/model_runner.py:162-167）与 _send_intermediate / _recv_intermediate（:170-185）。","hl":["_recv_intermediate","modelrunner"],"k":65}},"C3b":{"t":"卡 3 ｜ norm①：作用在完整 hidden 上","c":"C8","n":"算子与层","lab":["卡 3 ｜ norm①：作用在完整 hidden 上"],"cite":[["src/compute/layers/layernorm.py",40,"RMSNorm.forward","norm①：同上","    def forward(self, x: torch.Tensor, residual: torch.Tensor | None = None) -> tuple[torch.Tensor, torch.Tensor]:\n        # 普通模式：没有残差基线（第一次调用时就是这种）。\n        # 返回的第二个值是 x 本身 —— 它将成为后续的残差基线。\n        if residual is None:\n            # 融合模式：一步完成\"相加 + 归一化\"。\n            return _rmsnorm(x, self.weight, self.eps), x\n        # 注意这里没有赋值语句：两个张量是**被原地改写**的，\n        # x 现在是归一化结果、residual 现在是 (旧 x + 旧 residual)。\n        # 写成 x = ... 反而是错的（那会丢掉原地写的结果）。\n        _fused_add_rmsnorm(x, residual, self.weight, self.eps)\n        return x, residual","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/compute/layers/layernorm.py:40"]],"vllm":[["vllm/model_executor/layers/layernorm.py",37,"RMSNorm","CustomOp 版 RMSNorm：forward_native:74 / forward_cuda:96 各有实现","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/layernorm.py:37"],["vllm/model_executor/layers/activation.py",112,"SiluAndMul","CustomOp 激活，含 forward_cuda；同文件 MulAndSilu:261 是相反布局","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/activation.py:112"],["vllm/model_executor/layers/rotary_embedding/base.py",15,"RotaryEmbeddingBase","RoPE 基类：init_cache:58、forward_cuda:221；按平台分 14 个变体","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/rotary_embedding/base.py:15"],["vllm/model_executor/layers/rotary_embedding/common.py",125,"ApplyRotaryEmb","独立的「应用旋转」CustomOp，支持 is_neox_style 与是否包 cos/sin","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/rotary_embedding/common.py:125"],["vllm/model_executor/layers/fused_qk_norm_rope.py",138,"fused_qk_rmsnorm_rope_gate","把 q/k 的 RMSNorm 与 RoPE 融成一个 kernel，省一次访存","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/model_executor/layers/fused_qk_norm_rope.py:138"]],"vcmp":["都只做 RMS 缩放不做均值中心化、都用 fp32 的 cos/sin 表且要求 NeoX 半切分、都把残差加与 norm 融合。","vLLM 用 CustomOp 体系（forward_native/forward_cuda/forward_hip 多实现），并额外提供 qk-norm + rope 融合算子和前缀/交错式 RoPE；我们把 FlashInfer 原语包成 torch.library.custom_op（ops.py:22/37/81/96）自己声明 mutates_args，没有多平台实现。"],"doc":{"a":"flowdoc-C3b","sec":"ch-c8-h3-4","sect":"8.2.2 残差 + RMSNorm：把\"相加\"和\"归一化\"融成一次原地写","cid":"C8","text":"if residual is None: return _rmsnorm(x, self.weight, self.eps), x","hl":["rmsnorm"],"k":15}},"C3c":{"t":"卡 3 ｜ qkv_proj（列并行）","c":"C8","n":"算子与层","lab":["卡 3 ｜ qkv_proj（列并行）：","另外 8 个 Q 头、","4 个 KV 头","q:[N,8,128]"],"cite":[["src/compute/layers/linear.py",321,"QKVParallelLinear","PP 第 2 段、另一半头","class QKVParallelLinear(nn.Module):\n    \"\"\"\n    融合 QKV 投影层\n\n    【设计目的】\n    将 Query, Key, Value 的投影矩阵融合为一个大矩阵，减少 Kernel Launch 次数，提高显存带宽利用率。\n\n    【特性】\n    支持 MHA、MQA 和 GQA。\n    当 KV Head 数量小于 TP Size 时，会自动在多个 Rank 之间复制 KV Head。\n    \"\"\"\n\n    def __init__(\n        self,\n        hidden_size: int,\n        head_size: int,\n        total_num_heads: int,\n        total_num_kv_heads: int,\n        *,\n        bias: bool = False,\n    ):\n        super().__init__()\n        tp_size = get_tp_group().size\n        self.hidden_size = hidden_size\n        self.head_size = head_size\n        self.num_heads_total = total_num_heads\n        self.num_kv_heads_total = total_num_kv_heads\n        # Q 均分到每个 rank\n        self.num_heads = divide(total_num_heads, tp_size)\n        # 处理 KV Head 数量小于 TP Size 的情况\n        # 处理办法不是报错，而是让多张卡**共享同一个 KV 头**（各自持一份相同的权重）。\n        if tp_size > total_num_kv_heads:\n            self.num_kv_heads = 1\n            # 记录每个 KV Head 需要被复制的次数 (例如 2个KV Head, 4个Rank -> 每个复制 2 次)\n            # 每个 KV 头要复制给几个 rank：tp=4 / nkv=2 → 每个头 2 份。\n            # 记录每个 KV Head 需要被复制的次数 (例如 2个KV Head, 4个Rank -> 每个复制 2 次)\n            self.num_kv_head_replicas = divide(tp_size, total_num_kv_heads)\n        else:\n            self.num_kv_heads = divide(total_num_kv_heads, tp_size)\n            self.num_kv_head_replicas = 1\n    # … 其余略；点「在 VS Code 打开 j+1 而不是 K+1）：\n        否则会把\"写了 KV 但被判定丢弃\"的 token 也算进块哈希，\n        后来的请求就会命中到与真实文本不符的前缀。\n        \"\"\"\n        new_tokens = (\n            seq.num_scheduled_tokens if num_new_tokens is None else num_new_tokens\n        )\n        if self.prefix_backend == \"none\" or new_tokens <= 0:\n            return\n        prev = seq.num_cached_tokens - new_tokens\n        # 只登记满块：半截块的内容下次可能变，绝不能进索引。\n        start = prev // self.block_size\n        end = min(seq.num_full_blocks(), seq.num_cached_tokens // self.block_size)\n        # 没有新的满块就直接返回。\n        if start >= end:\n            return\n        # 发布。publish 内部只对满块生效 —— 这是前缀索引的核心不变式。\n        self.index.publish(seq, end, self.blocks, start=start)","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/data/kv.py:178"]],"vllm":[["vllm/v1/core/kv_cache_utils.py",621,"hash_block_tokens","块 hash = hash_fn((parent_block_hash, 本块 token 元组, extra_keys))：父 hash 链式传递","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/core/kv_cache_utils.py:621"],["vllm/v1/core/kv_cache_utils.py",792,"get_request_block_hasher","只对写满 hash_block_size 的块增量算 hash，不足一块立刻返回空","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/core/kv_cache_utils.py:792"],["vllm/v1/core/kv_cache_utils.py",48,"BlockHash","块 hash 用 NewType(bytes)，另有 make_block_hash_with_group_id 拼组号","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/core/kv_cache_utils.py:48"],["vllm/v1/core/kv_cache_utils.py",583,"generate_block_hash_extra_keys","把多模态 / LoRA / cache_salt 等特征并进 hash，避免跨请求误命中","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/core/kv_cache_utils.py:583"],["vllm/v1/core/block_pool.py",225,"BlockPool.cache_full_blocks","把满块 promote 并把 hash 写进映射表（跳过 null/被 mask 的块）","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/core/block_pool.py:225"],["vllm/v1/core/block_pool.py",198,"BlockPool.get_cached_block","按 BlockHashWithGroupId 直接取缓存块并 touch（刷新 LRU）","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/core/block_pool.py:198"],["vllm/v1/core/kv_cache_coordinator.py",407,"KVCacheCoordinator.find_longest_cache_hit","取最长可复用前缀块序列（子类按单组/混合组分别实现）","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/core/kv_cache_coordinator.py:407"]],"vcmp":["都是链式块哈希（父 hash + 本块 token ids），只登记写满的整块，按最长前缀命中复用。","我们用 xxhash.xxh64：把父 hash 当种子写进 hasher 再喂 token ids，并在 match 里用 block.token_ids != toks 逐块比内容兜底；索引有 HashPrefixIndex 与 RadixPrefixIndex 两套，靠 publish/invalidate/release_seq 手工维护。vLLM 的 hash 输入是 (parent_hash, token_tuple, extra_keys)，走可配 hash_function，键是 BlockHash + group_id，块→hash 用 BlockHashToBlockMap（允许一块对多 hash），粒度上还有 BlockHashListWithBlockSize / resolve_block_hashes 来兼容粗块与部分块缓存。"],"doc":{"a":"flowdoc-S7","sec":"ch-c11-h3-11","sect":"11.2.9 状态推进：num_cached_tokens += j+1 与覆盖写","cid":"C11","text":"选\"覆盖\"而不是\"回滚\"的代价是：被拒位置的 KV 是脏的，任何\"按块内容做哈希\"的前缀发布都必须显式传有效长度，否则后来的请求会命中与真实文本不符的前缀——这就是 sync_prefix 为什么要开 num_new_tokens 这个参数（src/data/kv.py:178-185）。","hl":["sync_prefix"],"k":46}},"Q1":{"t":"read_samples(n_p, n_d)：_copy_event.synch","c":"C7","n":"计算路径","lab":["read_samples(n_p, n_d)：_copy_event.synchronize() ←CPU 唯一真正阻塞的地方 按元素数切片：","p_ids = _sample_cpu[n_d :n_d+n_p]、","d_ids = _sample_cpu[:n_d]prefill 通道的元素数 = 普通 prefill每序列 1 个 / 投机验证 = 请求数 × 定宽","p=s[n_{d}:n_{d}+n_{p}],\\quad d=s[0:n_{d}]"],"cite":[["src/compute/model_runner.py",514,"ModelRunner.read_samples","按元素数切片：p_ids = s[n_d:n_d+n_p]、d_ids = s[:n_d]","    def read_samples(self, n_p: int, n_d: int) -> tuple[list[int], list[int]]:\n        # 真正的阻塞点：等上面那个 event 完成，此时数据一定已经在 CPU 的锁页内存里。\n        self._copy_event.synchronize()\n        # 布局要和拷入时一致：decode 在前、prefill 在后（见 _stage_samples 的切片顺序）。\n        p_ids = self._sample_cpu[n_d : n_d + n_p].tolist() if n_p else []\n        d_ids = self._sample_cpu[:n_d].tolist() if n_d else []\n        return p_ids, d_ids","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/compute/model_runner.py:514"],["src/compute/model_runner.py",490,"ModelRunner._stage_samples","采样结果写回 pinned 暂存区","    def _stage_samples(\n        self, p: torch.Tensor | None, d: torch.Tensor | None","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/compute/model_runner.py:490"]],"vllm":[["vllm/v1/worker/gpu_model_runner.py",3720,"GPUModelRunner._sample","取 sampling_metadata 调 sampler；有投机元数据时改走 rejection_sampler","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/worker/gpu_model_runner.py:3720"],["vllm/v1/sample/sampler.py",73,"Sampler.forward","logits→float32→logits processors→采样→gather logprobs，返回 SamplerOutput","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/sample/sampler.py:73"],["vllm/v1/sample/metadata.py",15,"SamplingMetadata","批量采样参数：temperature/top_p/top_k/min_p 张量 + all_greedy/all_random 快路径 + generators","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/sample/metadata.py:15"],["vllm/v1/outputs.py",279,"SamplerOutput","采样输出容器：sampled_token_ids(GPU 张量) + logprobs_tensors","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/outputs.py:279"],["vllm/v1/worker/gpu_model_runner.py",954,"GPUModelRunner.__init__","预分配 (max_num_reqs,1) int64 pinned CPU 缓冲与 transfer_event","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/worker/gpu_model_runner.py:954"],["vllm/v1/worker/gpu_model_runner.py",7659,"GPUModelRunner._to_list","copy_(non_blocking)→trans cached=keep)\n            # radix 后端相反：先归还、再作废 —— 树结构要先释放才能判断哪些页可回收。\n            if not keep and self.prefix_backend == \"radix\":\n                self.index.invalidate(bid, self.blocks)\n\n        # 序列清空。块表与缓存计数必须一起归零，否则下次分配会错位。\n        seq.block_table.clear()\n        seq.num_cached_tokens = 0","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/dzyy-vllm/vllm-v6/src/data/kv.py:202"]],"vllm":[["vllm/v1/core/sched/scheduler.py",705,"Scheduler.schedule","FCFS 下 preempted_req = self.running.pop()：牺牲队尾的解码请求","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/core/sched/scheduler.py:705"],["vllm/v1/core/sched/scheduler.py",1405,"Scheduler._preempt_request","释放块与编码器缓存，status=PREEMPTED，清零 spec_token_ids","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/core/sched/scheduler.py:1405"],["vllm/v1/core/sched/scheduler.py",1425,"Scheduler._preempt_request","进度归零：num_computed_tokens = 0，也就是完整重算（recompute）","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/core/sched/scheduler.py:1425"],["vllm/v1/core/sched/scheduler.py",1445,"Scheduler._preempt_request","self.waiting.prepend_request(request)：被抢占者插回 waiting 队头","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/core/sched/scheduler.py:1445"],["vllm/v1/core/sched/scheduler.py",2522,"Scheduler._free_request_blocks","把该请求占用的 KV 块交还块池（可能留在前缀缓存里）","vscode://vscode-remote/wsl+Ubuntu/home/Kritace/miniconda3/envs/vllm-exp/lib/python3.12/site-packages/vllm/vllm/v1/core/sched/scheduler.py:2522"]],"vcmp":["都从 running 尾部挑牺牲者、把请求放回 waiting 队头，并丢弃已有进度从头重算。","我们的 preempt(seq) 用 kv.deallocate(publish=False) 明确不把块发布进前缀索引，同时清 spec_draft_ids；vLLM 由 _free_request_blocks 归还块、num_preemptions += 1、清零 spec_token_ids，并处理异步调度下的 drop_stale_output / num_stale_output_tokens（旧输出作废）。vLLM v1 只有 recompute 一种       d.vllm.forEach(function (c) {
        h.push('<div class="fv"><div class="fcs">' + esc(c[0] + (c[1] ? ':' + c[1] : '')) + '</div>');
        h.push('<div class="fcn">' + esc(c[2] + (c[3] ? ' — ' + c[3] : '')) + '</div>');
        h.push('<div class="fa">');
        if (FP) h.push('<a class="ok" href="' + fpCmd('vllm', c[0], c[1]) + '" title="flowpreview.openAt：在 vLLM 官方源码里打开这一行">↗ 打开 vLLM 这一行</a>');
        h.push('<a class="vc" href="' + vscodeCmd(c[4], c[1]) + '">↗ VS Code 打开 vLLM</a>'
               + '<button class="fcp2" data-copy="' + esc('code --goto ' + c[0] + (c[1] ? ':' + c[1] : '')) + '">⌘ 复制 code --goto</button></div></div>');
      });
    }
    if (FP) {
      h.push('<p class="fnote"><b>可点预览已就绪：</b>绿色按钮 <b>↗ 打开源码这一行</b> / <b>↗ 打开 vLLM 这一行</b> '
             + '会直接在编辑器里打开对应文件并选中该行，<b>默认开在右侧</b>（预览页不会被盖住；'
             + '要改成当前列就把 <code>flowpreview.openBeside</code> 设为 <code>false</code>）。'
             + '复制按钮仍然保留，方便把位置贴给别人。</p>');
    } else if (IN_VSCODE) {
      h.push('<p class="fnote"><b>为什么点不动：</b>VS Code 的内置预览（Simple Browser / HTML 预览）本质是个 webview，'
             + '<code>command:</code> URI 与 <code>vscode://</code> 自定义协议都会被它拦掉 —— webview 的 '
             + '<code>enableCommandUris</code> 默认 <b>false</b>，只有写这个预览扩展的作者能开，用户侧没有开关。'
             + '想点一下就跳代码，请用命令 <b>dzyy: 打开项目全景手册（可点预览）</b> 或 '
             + '<b>dzyy: 打开流程图查看器（可点预览）</b>（扩展 <code>dzyy.flowpreview</code>）；'
             + '或者用复制按钮：<b>⧉ 复制 路径:行</b> → 粘到 <b>Ctrl+P</b>；'
             + '<b>⌘ 复制 code --goto</b> → 粘到 WSL 终端（Enter 即开）。</p>');
    }
    h.push('</div>');
    box.innerHTML = h.join('');
    box.hidden = false;
    box.querySelector('.fclose').onclick = function () { box.hidden = true; };
    Array.prototype.forEach.call(box.querySelectorAll('button[data-copy]'), function (b) {
      b.onclick = function () { copy(b.dataset.copy, b); };
    });
    var j = box.querySelector('a.fdj');
    if (j) {
      j.onclick = function (ev) {
        var href = j.getAttribute('href') || '';
        if (href.charAt(0) !== '#') return;            // 查看器里是跨文档链接，交给浏览器
        ev.preventDefault();
        fdGo(j.getAttribute('data-fd'),
             (j.getAttribute('data-hl') || '').split('|').filter(function (x) { return x; }));
      };
    }
  };
  Array.prototype.forEach.call(document.querySelectorAll('g.fm'), function (g) {
    g.addEventListener('click', function (ev) { ev.stopPropagation(); flowDetail(g.dataset.nid || (g.id || '').replace('flow-', '')); });
  });
}

flowPanelInit();
</script>

</body>
</html>
