0.6B 并发 32、共 4096 token，dp1 </mtext><mn>710.0</mn><mo>→</mo><mtext>dp2 </mtext><mn>1331.4</mn><mtext>（</mtext><mn>1.88</mn><mo>×</mo><mtext>）；开图后 </mtext><mn>4784</mn><mo>→</mo><mn>8260</mn><mtext>（</mtext><mn>1.73</mn><mo>×</mo><mtext>）</mtext></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mtext>EP：与图重放负交互 —— 同口径 </mtext><mn>201.0</mn><mo>→</mo><mn>161.3</mn><mtext> token/s（</mtext><mo>−</mo><mn>19.8</mn><mi mathvariant="normal">%</mi><mtext>）</mtext></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mtext>但逐算子执行时方向相反（</mtext><mn>29.3</mn><mo>→</mo><mn>30.0</mn><mtext>，</mtext><mo>+</mo><mn>2.5</mn><mi mathvariant="normal">%</mi><mtext>）</mtext><mo>⇒</mo><mtext>是「EP</mtext><mo>×</mo><mtext>图重放」这个组合负，不是 EP 慢</mtext></mrow></mstyle></mtd></mtr></mtable></math></span></div></span></div></foreignObject></g></g><g class="node default  " id="mmd_render_0-flowchart-N4-56" data-look="classic" transform="translate(5514.25, 1437)"><rect class="basic label-container" style="" x="-418.28125" y="-116.5" width="836.5625" height="233"/><g class="label" style="" transform="translate(-388.28125, -101.5)"><rect/><foreignObject width="776.5625" height="203"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel "><div style="display: flex; align-items: center; justify-content: center; white-space: nowrap;"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mtable rowspacing="0.25em" columnalign="center" columnspacing="0em"><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mtext>【投机的收益完全由文本重复度决定】</mtext></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mtext>（本仓库 v6，0.6B，单请求 64 token，查表式草稿）</mtext></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mtext>高重复 </mtext><mn>48.7</mn><mo>→</mo><mn>285.9</mn><mo>=</mo><mn>5.87</mn><mo>×</mo><mo>∣</mo><mtext>自然散文 </mtext><mn>1.75</mn><mo>×</mo><mo>∣</mo><mtext>代码 </mtext><mn>1.16</mn><mo>×</mo></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mtext>—— 相差 5 倍，引用时必须注明输入文本</mtext></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mtext>每步期望产出 </mtext><mi>E</mi><mo>=</mo><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><msup><mi>α</mi><mrow><mi>K</mi><mo>+</mo><mn>1</mn></mrow></msup><mo stretchy="false">)</mo><mi mathvariant="normal">/</mi><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>α</mi><mo stretchy="false">)</mo><mtext>（</mtext><mi>α</mi><mtext> 为接受率）</mtext></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mtext>高重复 </mtext><mi>α</mi><mo>≈</mo><mn>1</mn><mo>⇒</mo><mtext>每步吃满 </mtext><mi>K</mi><mo>+</mo><mn>1</mn><mtext>；代码 </mtext><mi>K</mi><mo>=</mo><mn>4</mn><mtext> 就见顶（</mtext><mi>E</mi><mo>=</mo><mn>2.61</mn><mtext> 峰值，</mtext><mi>K</mi><mo>=</mo><mn>6</mn><mtext> 掉到 </mtext><mn>2.20</mn><mtext>）</mtext></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mtext>【投机对首 token 是负收益】官方 8B 口径 </mtext><mn>27.3</mn><mtext> ms</mtext><mo>→</mo><mn>73.3</mn><mtext> ms（</mtext><mn>2.68</mn><mo>×</mo><mtext> 变差）</mtext></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mtext>因为无论接受多少，都要先付草稿 </mtext><mi>K</mi><mtext> 次前向</mtext><mo>+</mo><mtext>目标模型验证 </mtext><mi>K</mi><mo>+</mo><mn>1</mn><mtext> 个位置的代价，而首 token 只等第一个</mtext></mrow></mstyle></mtd></mtr></mtable></math></span></div></span></div></foreignObject></g></g><g class="node default  " id="mmd_render_0-flowchart-N5-57" data-look="classic" transform="translate(5514.25, 1821)"><rect class="basic label-container" style="" x="-441.234375" y="-153" width="882.46875" height="306"/><g class="label" style="" transform="translate(-411.234375, -138)"><rect/><foreignObject width="822.46875" height="276"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel "><div style="display: flex; align-items: center; justify-content: center; white-space: nowrap;"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mtable rowspacing="0.25em" columnalign="center" columnspacing="0em"><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mtext>【三个「算错就静默出错」的地方】</mtext></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mtext>① 投机回传的是 定宽</mtext><mo>×</mo><mtext>请求数 个元素（不是请求数），算错会把接受长度钳到 1、收益全消失</mtext></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mtext>② 定宽补齐的两端必须一致且填 </mtext><mo>−</mo><mn>1</mn></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mtext>③ 投机那一步不拉新 prefill（会让定宽切片整体错位）</mtext></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mtext>【「贪心投机与基线逐 token 相同」只在 top-2 logits 间隔大于数值误差时成立】</mtext></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mtext>自然散文上实测到过完全并列（两个 token 都是 </mtext><mo>+</mo><mn>20.250</mn><mtext>）；bf16 下这点差距被两个注意力算子的累加顺序抹平</mtext></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mtext>用「逐 token 相同」验收时必须选间隔大的文本，否则会把数值并列误判成 bug</mtext></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mtext>【两对容易混的概念】</mtext></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mrow><mtext>图重放的补齐槽（槽位 </mtext><mo>−</mo><mn>1</mn><mtext>，从来没写过）vs 投机多余槽（真写过，靠下一步覆盖）</mtext></mrow></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mtext>调度级分块（把长 prompt 拆成多次前向，本项目没有）vs 算子内分块（一次前向内把序列切块）</mtext></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mtext>本图只覆盖 v0–v6。v7 量化已排除在计划外，图里没有任何量化环节</mtext></mstyle></mtd></mtr></mtable></math></span></div></span></div></foreignObject></g></g><g class="node default  " id="mmd_render_0-flowchart-N6-58" data-look="classic" transform="translate(5514.25, 2182)"><rect class="basic label-container" style="" x="-386.640625" y="-117" width="773.28125" height="234"/><g class="label" style="" transform="translate(-356.640625, -102)"><rect/><foreignObject width="713.28125" height="204"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel "><div style="display: flex; align-items: center; justify-content: center; white-space: nowrap;"><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mtable rowspacing="0.25em" columnalign="center" columnspacing="0em"><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mtext>【本轮补进来的四条，都是原来漏掉的】</mtext></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mtext>① 六处接口只画了一处（段间点对点），下发 / 回传 / 同步点 / 流出四处全缺</mtext></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mtext>② 采样只写到「从 logits 采一个」，没写 softmax 除温度 → top-k → top-p → min-p 这条链</mtext></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mtext>③ 每步收尾（判结束 / 发布满块 / 抢占 / 死循环保护）全缺</mtext></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mtext>④ 三种形状对照全缺 —— 而这正是「prefill 与 decode 到底差在哪」的答案</mtext></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mtext>【还有一处是错的】原来把段间点对点画成了「有反向回传」，实际只有正向一项</mtext></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mtext>采样出的 token 不走段间点对点，走的是控制通道（只传字节、在 CPU 上、用 Gloo 而非 NCCL）</mtext></mstyle></mtd></mtr><mtr><mtd><mstyle scriptlevel="0" displaystyle="true"><mtext>因为一次调度结果里有几十个形状不固定的字段，而张量通信只能传张量</mtext></mstyle></mtd></mtr></mtable></math></span></div></span></div></foreignObject></g></g></g></g></g><defs><filter id="mmd_render_0-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="mmd_render_0-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg></div></div>
<div id="empty">未找到内联 SVG：请先跑无头渲染生成对应的 *_rendered.svg。</div>
<script>
const stage = document.getElementById('stage');
const wrap  = document.getElementById('wrap');
const pctEl = document.getElementById('pct');
const svg   = wrap.querySelector('svg');
let scale = 1, tx = 0, ty = 0;
const W = svg ? (+svg.getAttribute('width')  || svg.viewBox.baseVal.width  || 1000) : 1000;
const H = svg ? (+svg.getAttribute('height') || svg.viewBox.baseVal.height || 1000) : 1000;
function apply() {
  wrap.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  pctEl.textContent = Math.round(scale * 100) + '%';
}
function fit(mode) {
  const r = stage.getBoundingClientRect();
  const k = mode === 'w' ? (r.width - 24) / W : (r.height - 24) / H;
  scale = Math.max(0.01, k);
  tx = (r.width  - W * scale) / 2;
  ty = (r.height - H * scale) / 2;
  apply();
}
function zoomAt(cx, cy, factor) {
  const ns = Math.min(20, Math.max(0.02, scale * factor));
  tx = cx - (cx - tx) * (ns / scale);
  ty = cy - (cy - ty) * (ns / scale);
  scale = ns; apply();
}
document.getElementById('fitw').onclick = () => fit('w');
document.getElementById('fith').onclick = () => fit('h');
document.getElementById('one').onclick  = () => { scale = 1; tx = 12; ty = 12; apply(); };
document.getElementById('zi').onclick   = () => { const r = stage.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, 1.25); };
document.getElementById('zo').onclick   = () => { const r = stage.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, 0.8); };
stage.addEventListener('wheel', (e) => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.12 : 0.89);
}, { passive: false });
let drag = null;
stage.addEventListener('mousedown', (e) => { drag = { x: e.clientX - tx, y: e.clientY - ty }; stage.classList.add('dragging'); });
window.addEventListener('mousemove', (e) => { if (!drag) return; tx = e.clientX - drag.x; ty = e.clientY - drag.y; apply(); });
window.addEventListener('mouseup', () => { drag = null; stage.classList.remove('dragging'); });
stage.addEventListener('dblclick', () => fit('w'));
window.addEventListener('keydown', (e) => {
  if (e.key === '+' || e.key === '=') document.getElementById('zi').click();
  else if (e.key === '-') document.getElementById('zo').click();
  else if (e.key === '0') fit('w');
});
window.addEventListener('resize', () => fit('w'));
fit('w');
</script>
