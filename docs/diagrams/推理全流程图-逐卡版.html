（词表并行）= 57 次<br />本机实测 8 KB = 76.7 µs；0.6B 每步 ≈ 224 KB ⇒ 通信 ≈ 2.15 ms ⇒ TP=2 反而更慢（37.9 vs 单卡 49.5 tok/s）<br />⚠ 没有「全局方差归一化」那次 —— 那是 MiniMax Lightning 层的设计，别串场</p></span></div></foreignObject></g></g><g class="node default comm " id="mmd_render_0-flowchart-NAX-190" data-look="classic" transform="translate(895.5, 1651)"><rect class="basic label-container" style="fill:#eef3ff !important;stroke:#4a6fa5 !important;stroke-width:1.5px !important" x="-130" y="-111" width="260" height="222"/><g class="label" style="color:#1b2b45 !important" transform="translate(-100, -96)"><rect/><foreignObject width="200" height="192"><div style="color: rgb(27, 43, 69) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#1b2b45 !important" class="nodeLabel "><p>另外两个轴：DP = dp_size 份完整副本、副本之间零通信；<br />EP = 在现有 TP rank 上切专家轴（本项目把所有 token 都算一遍、只算自己那部分专家），合并仍是一次 allreduce</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="mmd_render_0-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="mmd_render_0-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg></div></div>
<div id="empty">未找到内联 SVG：请先跑无头渲染生成对应的 *_rendered.svg。</div>
<script>
const stage = document.getElementById('stage');
const wrap  = document.getElementById('wrap');
const pctEl = document.getElementById('pct');
const svg   = wrap.querySelector('svg');
let scale = 1, tx = 0, ty = 0;
const W = svg ? (+svg.getAttribute('width')  || svg.viewBox.baseVal.width  || 1000) : 1000;
const H = svg ? (+svg.getAttribute('height') || svg.viewBox.baseVal.height || 1000) : 1000;
function apply() {
  wrap.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  pctEl.textContent = Math.round(scale * 100) + '%';
}
function fit(mode) {
  const r = stage.getBoundingClientRect();
  const k = mode === 'w' ? (r.width - 24) / W : (r.height - 24) / H;
  scale = Math.max(0.01, k);
  tx = (r.width  - W * scale) / 2;
  ty = (r.height - H * scale) / 2;
  apply();
}
function zoomAt(cx, cy, factor) {
  const ns = Math.min(20, Math.max(0.02, scale * factor));
  tx = cx - (cx - tx) * (ns / scale);
  ty = cy - (cy - ty) * (ns / scale);
  scale = ns; apply();
}
document.getElementById('fitw').onclick = () => fit('w');
document.getElementById('fith').onclick = () => fit('h');
document.getElementById('one').onclick  = () => { scale = 1; tx = 12; ty = 12; apply(); };
document.getElementById('zi').onclick   = () => { const r = stage.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, 1.25); };
document.getElementById('zo').onclick   = () => { const r = stage.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, 0.8); };
stage.addEventListener('wheel', (e) => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.12 : 0.89);
}, { passive: false });
let drag = null;
stage.addEventListener('mousedown', (e) => { drag = { x: e.clientX - tx, y: e.clientY - ty }; stage.classList.add('dragging'); });
window.addEventListener('mousemove', (e) => { if (!drag) return; tx = e.clientX - drag.x; ty = e.clientY - drag.y; apply(); });
window.addEventListener('mouseup', () => { drag = null; stage.classList.remove('dragging'); });
stage.addEventListener('dblclick', () => fit('w'));
window.addEventListener('keydown', (e) => {
  if (e.key === '+' || e.key === '=') document.getElementById('zi').click();
  else if (e.key === '-') document.getElementById('zo').click();
  else if (e.key === '0') fit('w');
});
window.addEventListener('resize', () => fit('w'));
fit('w');
</script>
