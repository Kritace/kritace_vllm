ht: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel "><p>_update_spec_batch（投机通道）<br />num_cached_tokens += j + 1；sync_prefix 也传 j + 1</p></span></div></foreignObject></g></g><g class="node default  " id="mmd_render_0-flowchart-R3-134" data-look="classic" transform="translate(1667.12890625, 7047.671875)"><rect class="basic label-container" style="" x="-130" y="-51" width="260" height="102"/><g class="label" style="" transform="translate(-100, -36)"><rect/><foreignObject width="200" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel "><p>判结束：命中 EOS / 到 max_tokens ⇒ FINISHED + deallocate(publish=True)</p></span></div></foreignObject></g></g><g class="node default  " id="mmd_render_0-flowchart-R4-135" data-look="classic" transform="translate(1667.12890625, 7199.671875)"><rect class="basic label-container" style="" x="-130" y="-51" width="260" height="102"/><g class="label" style="" transform="translate(-100, -36)"><rect/><foreignObject width="200" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel "><p>发布满块进前缀索引（半截块不许进：内容下一步还会变）</p></span></div></foreignObject></g></g><g class="node default warn " id="mmd_render_0-flowchart-R5-136" data-look="classic" transform="translate(1667.12890625, 7459.671875)"><rect class="basic label-container" style="fill:#fdf1f0 !important;stroke:#b3564f !important;stroke-width:1.3px !important" x="-130" y="-87" width="260" height="174"/><g class="label" style="color:#6d2a26 !important" transform="translate(-100, -72)"><rect/><foreignObject width="200" height="144"><div style="color: rgb(109, 42, 38) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#6d2a26 !important" class="nodeLabel "><p>★ 已完成的序列必须从 running 里摘掉<br />（漏了 ⇒ 组包断言 len(token_ids) == num_cached_tokens + 1 失败）</p></span></div></foreignObject></g></g><g class="node default  " id="mmd_render_0-flowchart-R6-137" data-look="classic" transform="translate(1809.82421875, 7635.671875)"><rect class="basic label-container" style="" x="-156.75" y="-39" width="313.5" height="78"/><g class="label" style="" transform="translate(-126.75, -24)"><rect/><foreignObject width="253.5" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel "><p>EngineCoreOutput(new_token_ids, is_finished)</p></span></div></foreignObject></g></g><g class="node default io " id="mmd_render_0-flowchart-H4-146" data-look="classic" transform="translate(1561.25390625, 7848.671875)"><rect class="basic label-container" style="fill:#fff4e6 !important;stroke:#c07a2b !important;stroke-width:1.5px !important" x="-130" y="-75" width="260" height="150"/><g class="label" style="color:#5a3a12 !important" transform="translate(-100, -60)"><rect/><foreignObject width="200" height="120"><div style="color: rgb(90, 58, 18) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#5a3a12 !important" class="nodeLabel "><p>交接⑥ 流出：这一步的增量 token<br />每步都发生（真实服务在这里流式返回；run.py 是攒到结束一次打印）</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="mmd_render_0-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="mmd_render_0-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg> <script>
const stage = document.getElementById('stage');
const wrap  = document.getElementById('wrap');
const pctEl = document.getElementById('pct');
const svg   = wrap.querySelector('svg');
let scale = 1, tx = 0, ty = 0;
const W = svg ? (+svg.getAttribute('width')  || svg.viewBox.baseVal.width  || 1000) : 1000;
const H = svg ? (+svg.getAttribute('height') || svg.viewBox.baseVal.height || 1000) : 1000;
function apply() {
  wrap.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  pctEl.textContent = Math.round(scale * 100) + '%';
}
function fit(mode) {
  const r = stage.getBoundingClientRect();
  const k = mode === 'w' ? (r.width - 24) / W : (r.height - 24) / H;
  scale = Math.max(0.01, k);
  tx = (r.width  - W * scale) / 2;
  ty = (r.height - H * scale) / 2;
  apply();
}
function zoomAt(cx, cy, factor) {
  const ns = Math.min(20, Math.max(0.02, scale * factor));
  tx = cx - (cx - tx) * (ns / scale);
  ty = cy - (cy - ty) * (ns / scale);
  scale = ns; apply();
}
document.getElementById('fitw').onclick = () => fit('w');
document.getElementById('fith').onclick = () => fit('h');
document.getElementById('one').onclick  = () => { scale = 1; tx = 12; ty = 12; apply(); };
document.getElementById('zi').onclick   = () => { const r = stage.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, 1.25); };
document.getElementById('zo').onclick   = () => { const r = stage.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, 0.8); };
stage.addEventListener('wheel', (e) => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.12 : 0.89);
}, { passive: false });
let drag = null;
stage.addEventListener('mousedown', (e) => { drag = { x: e.clientX - tx, y: e.clientY - ty }; stage.classList.add('dragging'); });
window.addEventListener('mousemove', (e) => { if (!drag) return; tx = e.clientX - drag.x; ty = e.clientY - drag.y; apply(); });
window.addEventListener('mouseup', () => { drag = null; stage.classList.remove('dragging'); });
stage.addEventListener('dblclick', () => fit('w'));
window.addEventListener('keydown', (e) => {
  if (e.key === '+' || e.key === '=') document.getElementById('zi').click();
  else if (e.key === '-') document.getElementById('zo').click();
  else if (e.key === '0') fit('w');
});
window.addEventListener('resize', () => fit('w'));
fit('w');
</script>
